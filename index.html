<title>מצגת לעיתונאים</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@300;400;500;600&display=swap">
<style>
/* Layout: 16:9 stage, one slide at a time, RTL, slides built from data in the script below.
   Narrow screens stack and the slide grows with its content. */
:root {
  --bg: #e8e5f1; --paper: #f8f6fb; --ink: #26233f; --ink-2: #5f5c7d; --rule: #dcd8ea;
  --brand: #5a54c8; --brand-soft: #c9c6ea; --brand-deep: #3d3896; --neutral: #bdb9d0;
  --sc-field: #5a54c8; --sc-field-d: #3d3896; --sc-mon: #2a9d8f; --sc-mon-d: #17665c; --sc-pan: #b5473a; --sc-pan-d: #8a2f24; --sc-net: #d99a2b; --sc-net-d: #8a5a0a;
  --opp: #2a5bbd; --opp-f: #ffffff; --coa: #c4541f; --coa-f: #ffffff;
  --hex1: #ece6f6; --hex2: #f4e4ee; --hex3: #e1e3f5; --men: #2878c8; --bar-soft: #8a88d2;
  --s1: #6a2f5b; --s2: #a35c8c; --s3: #d8a6c3; --s4: #dcd9e8; --s5: #b9bdee; --s6: #838bd8; --s7: #4b50ad; --su: #c4c1d4;
  --f1: #ffffff; --f2: #ffffff; --f3: #26233f; --f4: #26233f; --f5: #26233f; --f6: #1c1a35; --f7: #ffffff; --fu: #26233f;
  --tip-bg: #26233f; --tip-fg: #f8f6fb; --logo-filter: none;
  --font: "Assistant", "Arial Hebrew", Arial, sans-serif; --font-head: "Rubik", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100f22; --paper: #1c1a38; --ink: #ece9f8; --ink-2: #a6a3c6; --rule: #35325a;
    --brand: #8f8af0; --brand-soft: #4a4786; --brand-deep: #b9b5ff; --neutral: #55527a;
    --sc-field: #8f8af0; --sc-field-d: #b9b5ff; --sc-mon: #4fbfb0; --sc-mon-d: #8fe0d3; --sc-pan: #e0836f; --sc-pan-d: #f2b4a5; --sc-net: #e8b04a; --sc-net-d: #f5d38e;
    --opp: #7ea6f4; --opp-f: #0f1f45; --coa: #f2976a; --coa-f: #3a1606;
    --hex1: #25224a; --hex2: #33264a; --hex3: #222a52; --men: #5a9fe6; --bar-soft: #6a67c0;
    --s1: #d27bb0; --s2: #a85f8f; --s3: #7a4a74; --s4: #3f3c62; --s5: #5a60a6; --s6: #7d85d6; --s7: #a9aff0; --su: #4a4770;
    --f1: #1c1a35; --f2: #ffffff; --f3: #ffffff; --f4: #ece9f8; --f5: #ffffff; --f6: #1c1a35; --f7: #1c1a35; --fu: #ece9f8;
    --tip-bg: #ece9f8; --tip-fg: #1c1a38; --logo-filter: invert(1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100f22; --paper: #1c1a38; --ink: #ece9f8; --ink-2: #a6a3c6; --rule: #35325a;
  --brand: #8f8af0; --brand-soft: #4a4786; --brand-deep: #b9b5ff; --neutral: #55527a;
  --sc-field: #8f8af0; --sc-field-d: #b9b5ff; --sc-mon: #4fbfb0; --sc-mon-d: #8fe0d3; --sc-pan: #e0836f; --sc-pan-d: #f2b4a5; --sc-net: #e8b04a; --sc-net-d: #f5d38e;
  --hex1: #25224a; --hex2: #33264a; --hex3: #222a52; --men: #5a9fe6; --bar-soft: #6a67c0;
  --s1: #d27bb0; --s2: #a85f8f; --s3: #7a4a74; --s4: #3f3c62; --s5: #5a60a6; --s6: #7d85d6; --s7: #a9aff0; --su: #4a4770;
  --f1: #1c1a35; --f2: #ffffff; --f3: #ffffff; --f4: #ece9f8; --f5: #ffffff; --f6: #1c1a35; --f7: #1c1a35; --fu: #ece9f8;
  --tip-bg: #ece9f8; --tip-fg: #1c1a38; --logo-filter: invert(1); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); margin: 0; }
h1, h2, h3, h4 { font-family: var(--font-head); }
h3 small, h4 small { font-family: var(--font); }
.sub, .kicker, .hint2 { font-family: var(--font); }
.app { max-width: 1280px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 24px; display: grid; gap: 14px; }
.stage { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--paper); border-radius: 6px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(38,35,63,.08), 0 12px 32px rgba(38,35,63,.08); }
.slide { position: absolute; inset: 0; display: none; padding: 3.6cqw 5cqw 6cqw; flex-direction: column; }
.slide.on { display: flex; }
.brandmark { position: absolute; inset-inline-start: 5cqw; bottom: 1.9cqw; height: clamp(16px, 2cqw, 28px); filter: var(--logo-filter); opacity: .85; }
.foot-rule { position: absolute; inset-inline: 5cqw; bottom: 4.6cqw; height: 1px; background: var(--rule); }
.src { position: absolute; inset-inline-end: 5cqw; bottom: 1.6cqw; font-size: clamp(9px, .9cqw, 13px); color: var(--ink-2); max-width: 74cqw; line-height: 1.4; }
.pg { position: absolute; right: 12cqw; bottom: 2.2cqw; font-size: clamp(10px, .95cqw, 13px); color: var(--ink-2); font-variant-numeric: tabular-nums; }
h2 { font-weight: 500; font-size: clamp(19px, 2.4cqw, 34px); line-height: 1.25; margin: 0; text-wrap: wrap; letter-spacing: -.005em; max-width: 70cqw; }
.sub { margin: .6cqw 0 0; font-size: clamp(12px, 1.3cqw, 18px); color: var(--ink-2); font-weight: 400; max-width: 70cqw; text-wrap: balance; line-height: 1.35; }
.num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.body { flex: 1; min-height: 0; margin-top: 1.6cqw; display: flex; flex-direction: column; gap: 1.6cqw; }

/* Cover and section slides */
.cover, .section { justify-content: center; }
.hexes { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover .logo-big { position: relative; z-index: 1; height: clamp(22px, 3cqw, 40px); filter: var(--logo-filter); margin-bottom: 5cqw; align-self: flex-start; }
.copy { position: relative; z-index: 1; max-width: 46cqw; }
.cover h1 { font-weight: 600; font-size: clamp(34px, 6.2cqw, 88px); line-height: 1.05; margin: 0; letter-spacing: -.01em; }
.cover .period { margin: 1.6cqw 0 0; font-size: clamp(16px, 2cqw, 28px); font-weight: 400; color: var(--brand-deep); }
.rule { width: 6cqw; height: 2px; background: var(--brand); margin: 2.6cqw 0; border: 0; }
.meta { font-size: clamp(12px, 1.25cqw, 17px); color: var(--ink-2); line-height: 1.7; margin: 0; }
.section h1 { position: relative; z-index: 1; font-weight: 600; font-size: clamp(30px, 5cqw, 72px); line-height: 1.1; letter-spacing: -.01em; margin: 0; max-width: 46cqw; }
.section .kicker { position: relative; z-index: 1; font-size: clamp(16px, 2.1cqw, 29px); letter-spacing: .08em; color: var(--brand-deep); margin: 0 0 1.4cqw; font-weight: 500; }
.section .hint2 { position: relative; z-index: 1; margin: 1.6cqw 0 0; font-size: clamp(18px, 2.6cqw, 36px); color: var(--ink-2); }

/* Cards, grids */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; flex: 1; min-height: 0; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.6cqw; flex: 1; min-height: 0; }
.card { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 1.4cqw 1.6cqw 1.3cqw; border: 1px solid var(--rule); border-radius: 4px; background: color-mix(in srgb, var(--paper) 70%, var(--hex1)); }
.card h3 { margin: 0 0 1cqw; font-weight: 500; font-size: clamp(12px, 1.2cqw, 17px); line-height: 1.35; }
.card h3 small { display: block; font-weight: 400; font-size: .85em; color: var(--ink-2); margin-top: .2cqw; }
.legend { display: flex; flex-wrap: wrap; gap: .4cqw 1.4cqw; font-size: clamp(10px, 1cqw, 14px); color: var(--ink-2); margin-bottom: .8cqw; }
.legend i { display: inline-block; width: .9em; height: .9em; border-radius: 2px; margin-inline-end: .4em; vertical-align: -.1em; }
.legend .dm { background: var(--paper); border: 2px solid var(--ink); transform: rotate(45deg); width: .7em; height: .7em; border-radius: 0; }
.note { font-size: clamp(10px, .95cqw, 13px); color: var(--ink-2); margin: 0; line-height: 1.5; }
.toggle { display: inline-flex; align-items: center; gap: .6cqw; font-size: clamp(11px, 1.05cqw, 15px); color: var(--ink-2); cursor: pointer; margin-top: .8cqw; }
.toggle input { accent-color: var(--brand); width: 1.1em; height: 1.1em; margin: 0; }

/* Vertical bars */
.plot { flex: 1; min-height: 0; display: grid; grid-template-rows: 1fr auto; gap: .7cqw; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1cqw; border-bottom: 1px solid var(--ink-2);
  background: repeating-linear-gradient(to top, transparent 0, transparent calc(20% - 1px), var(--rule) calc(20% - 1px), var(--rule) 20%); }
.col { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding-inline: 12%; outline-offset: 2px; border-radius: 2px; }
.vcell { position: relative; min-width: 0; }
.vb { position: absolute; inset-inline: 0; bottom: 0; border-radius: 2px 2px 0 0; background: var(--bar-soft); transition: filter .15s; }
.vb.lead { background: var(--brand); }
.col:hover .vb, .col:focus-visible .vb { filter: brightness(.93) saturate(1.1); }
.vv { position: absolute; inset-inline: -30%; text-align: center; font-weight: 600; font-size: clamp(10px, 1.2cqw, 18px); line-height: 1; transform: translateY(-130%); margin-bottom: .2cqw; white-space: nowrap; }
.mk { position: absolute; inset-inline-start: 50%; width: 1cqw; height: 1cqw; min-width: 9px; min-height: 9px; transform: translate(50%, 50%) rotate(45deg); background: var(--paper); border: 2px solid var(--ink); }
.mk-t { position: absolute; inset-inline-start: calc(50% + 1cqw); transform: translateY(50%); font-size: clamp(9px, .9cqw, 12px); background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; padding: 0 3px; line-height: 1.25; white-space: nowrap; }
.nocmp .mk, .nocmp .mk-t { display: none; }
.vv.up { margin-bottom: 1.1cqw; }
.nocmp .vv.up { margin-bottom: .2cqw; }
.cats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1cqw; text-align: center; font-size: clamp(9px, 1cqw, 14px); color: var(--ink-2); line-height: 1.25; }

/* Horizontal bars */
.bhead { z-index: 3; display: inline-flex; flex-direction: column; align-items: center; font-size: clamp(10px, 1.15cqw, 16px); font-weight: 600; color: #fff; background: var(--brand-deep); border-radius: 4px; padding: .3cqw .9cqw; position: relative; margin-bottom: .9cqw; white-space: nowrap; }
.bhead::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: .55cqw solid transparent; border-top-color: var(--brand-deep); border-bottom: 0; }
.bpill { display: inline-block; min-width: 4.2cqw; text-align: center; font-weight: 700; font-size: clamp(11px, 1.3cqw, 18px); color: var(--brand-deep); background: color-mix(in srgb, var(--paper) 55%, var(--brand-soft)); border: 1.5px solid var(--brand-deep); border-radius: 99px; padding: .1cqw .6cqw; }
.hb.hasb .hrow { grid-template-columns: var(--hl, 15cqw) 1fr 6cqw; }
.hline { position: absolute; top: 50%; left: -1.7cqw; border-top: 2px dashed var(--brand-deep); height: 0; z-index: 2; }
.hline::before { content: ''; position: absolute; right: -2px; top: -.55cqw; border: .5cqw solid transparent; border-right: 0; border-left-color: var(--brand-deep); }
.vline { position: absolute; left: 50%; bottom: 100%; width: 0; border-inline-start: 2px dashed var(--brand-deep); transform: translateX(-1px); }
.vline::before { content: ''; z-index: 5; position: absolute; top: -.4cqw; left: -.55cqw; border: .5cqw solid transparent; border-top: 0; border-bottom-color: var(--brand-deep); transform: translateX(1px); }
.plot.hasb .cats > div { position: relative; z-index: 1; background: color-mix(in srgb, var(--paper) 70%, var(--hex1)); }
.bband > div { position: relative; display: flex; justify-content: center; }
.barw { color: var(--brand-deep); font-weight: 700; font-size: clamp(13px, 1.7cqw, 24px); line-height: 1; }
.hb.hasb .bcell { display: flex; align-items: center; justify-content: center; gap: .3cqw; text-align: center; border-inline-start: 1px dashed var(--rule); }
.bband { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1cqw; text-align: center; margin-top: .3cqw; }
.nocmp .vline, .nocmp .hline, .nocmp .barw, .nocmp .bhead, .nocmp .bpill, .nocmp .bband, .nocmp .bcell, .nocmp .bwrap { display: none; }
.hb.hasb.nocmp .hrow { grid-template-columns: var(--hl, 15cqw) 1fr; }
.hb { display: flex; flex-direction: column; justify-content: space-around; gap: .5cqw; flex: 1; min-height: 0; }
.hrow { display: grid; grid-template-columns: var(--hl, 15cqw) 1fr; gap: .9cqw; align-items: center; outline-offset: 2px; border-radius: 2px; }
.hlab { font-size: clamp(10px, 1.05cqw, 15px); line-height: 1.2; }
.htr { position: relative; display: flex; flex-direction: column; gap: 2px; }
.hbar { position: relative; height: clamp(8px, 1.5cqw, 20px); }
.hbar > b { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 2px; background: var(--bar-soft); transition: filter .15s; }
.hbar > b.lead { background: var(--brand); }
.hrow:hover .hbar > b, .hrow:focus-visible .hbar > b { filter: brightness(.93) saturate(1.1); }
.hbar > span { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 600; font-size: clamp(9px, 1.05cqw, 15px); }
.hbar > i { position: absolute; top: 50%; width: .9cqw; height: .9cqw; min-width: 8px; min-height: 8px; transform: translate(50%, -50%) rotate(45deg); background: var(--paper); border: 2px solid var(--ink); }
.nocmp .hbar > i { display: none; }
.gtight .htr { gap: 1px; }
.gtight .hbar { height: clamp(6px, 1.1cqw, 15px); }
.gtight .hbar > span { font-size: clamp(9px, 1.05cqw, 14px); }

/* Stacked 7-point rows */
.stk { display: flex; flex-direction: column; gap: .7cqw; --lab: 11cqw; }
.row { display: grid; grid-template-columns: var(--lab) 1fr; align-items: center; gap: 1.1cqw; padding: .4cqw 0; border-radius: 3px; outline-offset: 2px; transition: opacity .15s; }
.row.click { cursor: pointer; }
.hero .row { grid-template-columns: 1fr; gap: 0; }
.rowname { font-weight: 500; font-size: clamp(11px, 1.25cqw, 18px); line-height: 1.2; }
.rowname .t { display: flex; gap: 1cqw; align-items: flex-start; margin-top: .2cqw; font-weight: 600; font-size: clamp(14px, 2.1cqw, 30px); letter-spacing: -.01em; line-height: 1.1; }
.rowname .t > span { display: flex; flex-direction: column; }
.rowname .t em { font-style: normal; font-weight: 400; font-size: .48em; color: var(--ink-2); letter-spacing: 0; margin-top: .15cqw; white-space: nowrap; }
.stack { display: flex; height: clamp(24px, 3.8cqw, 54px); border-radius: 3px; overflow: hidden; background: var(--rule); }
.seg { flex: none; display: flex; align-items: center; justify-content: center; font-size: clamp(9px, 1.05cqw, 15px); font-weight: 500; border-inline-end: 1px solid var(--paper); transition: opacity .15s; min-width: 0; overflow: hidden; }
.grp.has-sel .row:not(.sel) { opacity: .45; }
.grp.hl .seg:not(.hl) { opacity: .25; }
.axis { display: grid; margin-inline-start: calc(var(--lab) + 1.1cqw); gap: 2px; }
.chip { display: flex; flex-direction: column; align-items: center; gap: .3cqw; font-size: clamp(8px, .9cqw, 12px); color: var(--ink-2); text-align: center; line-height: 1.2; padding: .2cqw 0; border-radius: 2px; outline-offset: 2px; }
.axis.ends { font-size: clamp(10px, 1.1cqw, 15px); color: var(--ink); font-weight: 500; margin-top: .1cqw; } .axis.ends span { white-space: nowrap; }
.chip i { display: block; width: 100%; height: .6cqw; min-height: 5px; border-radius: 1px; }
.brackets { display: grid; margin-inline-start: calc(var(--lab) + 1.1cqw); gap: 2px; font-size: clamp(9px, 1cqw, 14px); font-weight: 500; text-align: center; }
.brackets span { border-bottom: 1px solid var(--ink-2); padding-bottom: .25cqw; color: var(--ink-2); }
.axis, .brackets { transition: grid-template-columns .25s; }
.slg { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .6cqw 2cqw; margin-inline-start: calc(var(--lab) + 1.1cqw); margin-top: .3cqw; }
.slg .lgg { display: flex; flex-direction: column; align-items: stretch; gap: .3cqw; }
.slg .lgs { display: flex; gap: 1cqw; }
.slg .lgg > em { font-style: normal; font-size: clamp(9px, .95cqw, 13px); font-weight: 500; color: var(--ink-2); border-top: 1px solid var(--ink-2); padding-top: .25cqw; text-align: center; }
.slg .chip { flex-direction: row; gap: .4cqw; padding: 0; white-space: nowrap; }
.slg .chip i { width: 1.1cqw; height: 1.1cqw; min-width: 9px; min-height: 9px; border-radius: 2px; }
.split { display: grid; grid-template-columns: 1.75fr 1fr; gap: 3cqw; flex: 1; min-height: 0; }
.split > .main { display: flex; flex-direction: column; justify-content: center; gap: .9cqw; min-width: 0; }
.panel { display: flex; flex-direction: column; justify-content: center; gap: 1.4cqw; padding-inline-start: 2.6cqw; border-inline-start: 1px solid var(--rule); min-width: 0; }
.seg-btns { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; align-self: flex-start; flex-wrap: wrap; }
.seg-btns button { font: inherit; font-size: clamp(11px, 1.1cqw, 16px); padding: .55cqw 1.1cqw; background: transparent; color: var(--ink-2); border: 0; border-inline-end: 1px solid var(--rule); cursor: pointer; }
.seg-btns button:last-child { border-inline-end: 0; }
.seg-btns button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.seg-btns button:focus-visible { outline: 2px solid var(--brand-deep); outline-offset: -2px; }
.big { font-weight: 300; font-size: clamp(44px, 7.4cqw, 104px); line-height: .95; letter-spacing: -.03em; }
.big small { font-size: .5em; font-weight: 300; }
.lbl { font-size: clamp(13px, 1.45cqw, 21px); color: var(--ink); line-height: 1.35; margin: 0; }
.delta { font-size: clamp(11px, 1.1cqw, 16px); color: var(--ink-2); margin: 0; min-height: 1.4em; }

/* Donuts, stat tiles, cards */
.donuts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1cqw; align-items: start; }
.dn { display: flex; flex-direction: column; align-items: center; gap: .6cqw; text-align: center; outline-offset: 3px; border-radius: 4px; }
.dn svg { width: 100%; max-width: 13cqw; height: auto; }
.dn .dv { font-weight: 600; font-size: clamp(14px, 2cqw, 28px); color: var(--brand-deep); }
.dn .dk { font-size: clamp(10px, 1.15cqw, 16px); color: var(--ink-2); line-height: 1.25; }
.dn:hover circle.fg, .dn:focus-visible circle.fg { stroke: var(--brand-deep); }
.callouts { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; }
.callout { background: var(--brand); color: #fff; border-radius: 4px; padding: .9cqw 1.3cqw; font-size: clamp(11px, 1.15cqw, 16px); line-height: 1.4; }

  /* speaker script (from the Google Doc 'תסריט דוברות מעודכן V2'), keyed by final slide number; existing notes stay below it */
  var SCRIPT = {"1": "<p style=\"margin:10px 0 2px;color:var(--ink);font-weight:600\">שקף פתיחה א׳: מי אנחנו – חברת Hive ומטרת ההצגה</p><p style=\"margin:4px 0\">\"שלום לכולם, תודה שהגעתם. קוראים לי נועה, אני חוקרת התנהגותית ב-Hive, ואני שמחה להציג לכם היום את ממצאי המחקר המקיף שערכנו ב-Hive על הצעירים בישראל לקראת בחירות 2026.</p><p style=\"margin:4px 0\">למי שפחות מכיר, Hive היא פלטפורמה שמייצרת מודיעין דעת קהל ותובנות אסטרטגיות עבור השחקנים המרכזיים בשדה החברתי והפוליטי בישראל – ארגוני חברה אזרחית, קרנות, תנועות ומפלגות.</p><p style=\"margin:4px 0\">לאורך הדרך בנינו ב-Hive התמחות בצעירים, ומכאן גם המחקר שנציג היום. וכמו בצעירים, אנחנו מתמחים גם בסגמנטים נוספים בחברה הישראלית.</p><p style=\"margin:4px 0\">מטרת ההצגה היום היא להציג לכם תמונת עומק אמיתית, מבוססת דאטה, על הצעירים בישראל: מה מצבם, איזה תהליך הם עברו, איזה סוגיות באמת מעסיקות אותם, ואיפה המערכת הפוליטית והתקשורתית מפספסת אותם לחלוטין.\"</p><p style=\"margin:10px 0 2px;color:var(--ink);font-weight:600\">שקף פתיחה ב׳: פלטפורמת הדאטה והכלים של Hive</p><p style=\"margin:4px 0\">\"כדי להבין דעת קהל בצורה מדויקת, התשתית המסורתית כבר לא מספיקה – היא איטית, מנותקת ולעיתים מוטה. ב-Hive אנחנו מאגדים ומעבדים מגוון רחב של מקורות מידע (Data Sources) בזמן אמת כדי לייצר תמונה מקיפה על סגמנטים וקהלי יעד אסטרטגיים:</p><p style=\"margin:4px 0\">1. <b>ניטור רשתות:</b> מאפשר לראות מה נמצא על סדר היום ומה מהדהד, גם אם זה לא תמיד משקף את עמדות העומק של הציבור.</p><p style=\"margin:4px 0\">2. <b>סקרים מתמשכים:</b> מאפשרים למדוד מגמות ולא רק לקבל תמונת מצב של סקר בודד ונקודתי.</p><p style=\"margin:4px 0\">3. <b>לייב פאנלים:</b> פלטפורמה שפיתחנו ב-Hive, המאפשרת תקשורת יומית ושאלות פתוחות מול קהלי היעד בזמן אמת, כדי להבין מילים, שפה ותחושות.</p><p style=\"margin:4px 0\">4. <b>עיבוד קבוצות מיקוד:</b> עיבוד וניתוח חכם של תכנים איכותניים.</p><p style=\"margin:4px 0\">השילוב הזה מאפשר לנו וללקוחות שלנו לא רק 'למדוד' דעת קהל, אלא להבין לאן הטרנד הולך.\"</p><p style=\"margin:10px 0 2px;color:var(--ink);font-weight:600\">שקף 1: צעירים לקראת בחירות 2026</p><p style=\"margin:4px 0\">\"ועכשיו למחקר עצמו. המחקר מתמקד בצעירים יהודים, לא חרדים, בני 18 עד 25. מי שהוא היום בן 18 עד 25 עבר מסלול חיים חסר תקדים: הקורונה והלימודים מול מסך, משבר פוליטי והפגנות, ואז ה-7 באוקטובר ומלחמה קשה, כשחלק גדול מהם משרת במילואים עד היום.</p><p style=\"margin:4px 0\">כשניגשנו לנתונים האלה, הציפייה הייתה למצוא קבוצה שבורה ומרוסקת. מצאנו משהו מורכב בהרבה: ציבור פיכח, מחובר לחיים עצמם, שהוא הקהל הכי פתוח לשכנוע במערכת הבחירות הזו. בחצי השעה הקרובה אציג לכם מה הנתונים מלמדים על הצעירים בישראל.\"</p>", "2": "<p style=\"margin:4px 0\">\"שלושה נתונים מרכזיים שמגדירים את הפער מהמדגם הכללי:</p><p style=\"margin:4px 0\">ראשית, 58% מהצעירים לא רואים בפוליטיקה חלק מהזהות שלהם – כפליים מהמדגם הכללי.</p><p style=\"margin:4px 0\">שנית, רק 63% בטוחים במי שיצביעו, לעומת 86% במדגם הכללי. אחד מכל שלושה צעירים עוד לא החליט למי להצביע.</p><p style=\"margin:4px 0\">ושלישית, המקור המרכזי שלהם למידע פוליטי הוא אינסטגרם – 51% לעומת 33%.</p><p style=\"margin:4px 0\">מה שזה אומר עבורכם: זה הציבור הכי פתוח לשכנוע כרגע, והוא נמצא במקומות שהתקשורת המסורתית כמעט לא מגיעה אליהם.\"</p>", "3": "<p style=\"margin:4px 0\">\"מילה קצרה על המתודולוגיה והנתונים שמאחורי המחקר הזה:</p><p style=\"margin:4px 0\">1. סקר השטח מיוני הוא העמוד המרכזי: מדגם מייצג של 510 צעירים בני 18–25, יהודים ללא חרדים. סוקרים יצאו לכל רחבי הארץ, למקומות שבהם צעירים נמצאים, כמו קניונים ומרכזים גדולים, כדי לדגום צעירים ממש מהרחוב.</p><p style=\"margin:4px 0\">2. המדגם הכללי, להשוואה: סקרים מייצגים של כ-2,000 משיבים כל אחד (חברה יהודית ללא חרדים). לצדם סקרי Hive מהחודשים האחרונים, האחרון שבהם מאוקטובר.</p><p style=\"margin:4px 0\">3. הלייב-פאנלים: פלטפורמה שפיתחנו ב-Hive לבחינת מסרים באופן מהיר ומיידי. הפאנלים מבוססים על שאלות פתוחות בקבוצה איכותנית. משם מגיעים הציטוטים והשפה. כשתראו תגית 'Hive Live Panels', אלו נתונים להמחשה שנותנים מילים למספרים. בפאנלים האלה יש בכוונה יותר משתתפים מהאופוזיציה, כי המטרה היא לא לאמוד אלא להבין שפה ותגובה למסרים.</p><p style=\"margin:4px 0\">4. Hive Networks: כלי של Hive לניתוח השיח ברשתות החברתיות. בדקנו מה מופיע בטיקטוק שהצעירים נחשפים אליו, לעומת מה שמעסיק את כלל הציבור ברשתות. זה משלים את הסקרים: לא מה הם אומרים, אלא מה הם רואים.\"</p>", "4": "<p style=\"margin:4px 0\">\"נתחיל בניתוח המפה הפוליטית שלהם, ואז נעבור למה שהם מרגישים וחווים.\"</p>", "5": "<p style=\"margin:4px 0\">\"המדגם כולל 510 משיבים בגיל ממוצע 21.6, בחלוקה שווה בין נשים לגברים.</p><p style=\"margin:4px 0\">הנתון המרכזי כאן: 45% מהם יצביעו בפעם הראשונה בחייהם בבחירות אלו.</p><p style=\"margin:4px 0\">כל הזיכרון הפוליטי הבוגר של מצביע פעם ראשונה מורכב מסבבי בחירות חוזרים, מחאות ומלחמה. זה הרקע שמעצב את היחס שלהם למערכת הפוליטית.\"</p>", "6": "<p style=\"margin:4px 0\">\"הצעירים נוטים ימינה יותר מהמדגם הכללי: 45% מגדירים את עצמם ימין, לעומת 35% במדגם הכללי. שמאל מובהק כמעט אינו קיים בקבוצה זו – אחוז אחד בלבד.</p><p style=\"margin:4px 0\">בחלוקה לגושים: 40% בייס קואליציה, 37% בייס אופוזיציה, ו-14% נמצאים באמצע, בין הגושים. ה-14% האלה הם הקהל המכריע שנמצא במרכז הקמפיינים.\"</p>", "7": "<p style=\"margin:4px 0\">\"אם מחפשים את הצעיר המתלבט שיכריע את המערכה – לא ימצאו אותו בבית קפה בתל אביב.</p><p style=\"margin:4px 0\">הקבוצה הבין-גושית מורכבת מצעירים בוגרים יותר ומסורתיים יותר: 63% מהם בני 22–25, ו-58% מסורתיים (לעומת 36% בכלל מדגם הצעירים).</p><p style=\"margin:4px 0\">מבחינה גאוגרפית: רק 9% מתל אביב (לעומת 20% בכלל מדגם הצעירים), והיתר מרוכזים בחיפה, הצפון, הדרום ויהודה ושומרון.\"</p>", "8": "<p style=\"margin:4px 0\">\"בצד האיכותני ערכנו 3 פאנלים מקוונים עם 173 משתתפים. שלושה רבעים מהם נשים, ולשני שלישים פרופיל אופוזיציוני.</p><p style=\"margin:4px 0\">לכן, הפאנלים אינם באים לשקף אחוזים מייצגים, אלא להראות באיזו שפה הצעירים משתמשים ומה מציק להם ביומיום.\"</p>", "10": "<p style=\"margin:4px 0\">\"נעבור כעת לדפוסי ההצבעה וההשתתפות בבחירות.\"</p>", "11": "<p style=\"margin:4px 0\">\"58% מהצעירים אינם רואים בפוליטיקה מרכיב זהותי, לעומת 30% במדגם הכללי.</p><p style=\"margin:4px 0\">אבל ריחוק אינו בורות: כשבחנו ידע אזרחי בסיסי (כמו הגדרת אחוז החסימה), הצעירים השיגו תוצאות דומות ואף מעט טובות יותר מהמדגם הכללי. הם מבינים איך המערכת עובדת, הם פשוט שומרים ממנה מרחק רגשי.\"</p><p style=\"margin:4px 0\">\"וזה נראה כך גם ברשתות: בשיח שהצעירים נחשפים אליו כמעט אין דיון על החלפת השלטון. מה שמוביל שם הם ראיונות רחוב בסגנון 'למי אתם מצביעים?', חיפוש מנהיגות בימין ותחושה ש'כולם אותו דבר'. זה לא חוסר עניין בבחירות, אלא ריחוק מהמערכת.\"</p><p style=\"margin:4px 0;color:var(--ink-2)\">(מקור: Hive Networks, טיקטוק, אוגוסט–ספטמבר 2026)</p>", "12": "<p style=\"margin:4px 0\">\"רק 55% מהצעירות ו-62% מהגברים בטוחים לגמרי שיצאו להצביע, לעומת 68% במדגם הכללי.</p><p style=\"margin:4px 0\">כשבודקים את הביטחון בזהות המפלגה הנבחרת, הפער הופך לדרמטי: רק 21% מהצעירות בטוחות מאוד בבחירה שלהן. הצעירות הן הקבוצה הפתוחה והמהססת ביותר כרגע במפה הפוליטית.\"</p>", "13": "<p style=\"margin:4px 0\">\"בכלל אוכלוסיית הצעירים: 63% בטוחים בבחירה שלהם, מול 86% במדגם הכללי – פער של 23 נקודות אחוז.</p><p style=\"margin:4px 0\">כמעט אחד מכל שלושה צעירים עדיין לא נעול על פתק בקלפי. ההכרעה אצלם פתוחה לחלוטין.\"</p>", "14": "<p style=\"margin:4px 0\">\"כשהצגנו בפני משתתפי הפאנל את התחזית שנשים יהוו כרבע מחברי הכנסת הבאה, ושאף מפלגה שעוברת את אחוז החסימה אינה בראשות אישה, רק 4 מתוך 45 ציינו כי נתון זה ישפיע על הצבעתם.</p><p style=\"margin:4px 0\">גם בקבוצה שרובה נשים ואופוזיציה, סוגיות ייצוג מופשטות אינן המניע המרכזי להגעה לקלפי.\"</p>", "16": "<p style=\"margin:4px 0\">\"נעבור לשאלה מאיפה מגיעות ההשפעות הפוליטיות שלהם.\"</p>", "17": "<p style=\"margin:4px 0\">\"הגורם המשפיע ביותר הוא המשפחה (43%). חברים משפיעים על 26%, פרשנים על 17%, ומשפיעני רשת – למרות הנוכחות היומיומית – על 6% בלבד.</p><p style=\"margin:4px 0\">בנוסף, 43% מעידים כי אף גורם אינו משפיע עליהם, בייחוד גברים.\"</p>", "18": "<p style=\"margin:4px 0\">\"57% מדווחים כי כוונת ההצבעה שלהם דומה לזו של משפחתם, ו-42% מצביעים באופן דומה לחבריהם.</p><p style=\"margin:4px 0\">גם בעידן הרשתות החברתיות, שולחן השבת והסביבה הקרובה נותרו זירת השכנוע המרכזית.\"</p>", "19": "<p style=\"margin:4px 0\">\"42% מעדיפים לצרוך מידע פוליטי ברשתות החברתיות, ועוד 26% מעדיפים ערוצי טלגרם ווואטסאפ.</p><p style=\"margin:4px 0\">בתוך הרשתות החברתיות, אינסטגרם מובילה עם 51%. החדשות מגיעות אליהם בפורמט קצר ומהיר, ולרוב ללא תיווך ישיר של גופי התקשורת המסורתיים.\"</p>", "20": "<p style=\"margin:4px 0\">\"כששאלנו בפאנל מה גורם להם לעצור את הגלילה ברשת, התשובה המובילה הייתה: תוכן הכולל נתונים ועובדות (25 מתוך 46). לעומת זאת, מתקפות פוליטיות וסיסמאות כמעט לא נבחרו.</p><p style=\"margin:4px 0\">יותר מחצי מהמשתתפים (26 מתוך 48) אינם עוקבים אחרי אף פוליטיקאי. הם מחפשים תוכן ענייני ומעשי, ולא רטוריקה.\"</p>", "22": "<p style=\"margin:4px 0\">\"זהו החלק המרכזי שמציג את התמונה הרגשית והאזרחית של הצעירים.\"</p>", "23": "<p style=\"margin:4px 0\">\"כאן מופיע הנתון המשמעותי ביותר:</p><p style=\"margin:4px 0\">55% מהצעירים אינם מרוצים מהמצב במדינה (61% אצל הצעירות ו-51% אצל הצעירים).</p><p style=\"margin:4px 0\">אבל כששואלים אותם על חייהם האישיים, שביעות הרצון גבוהה: ציון 7.8 מתוך 10 בדוח האושר העולמי (מבוסס סקר גאלופ), לעומת ממוצע של 6.9 במדינות ה-OECD.</p><p style=\"margin:4px 0\">הפער הזה מראה שהתסכול מופנה כלפי המדינה והמוסדות השלטוניים, ולא כלפי מסלול החיים האישי.\"</p>", "24": "<p style=\"margin:4px 0\">\"בבייס האופוזיציה 79% אינם מרוצים מהמצב, לעומת 38% בבייס הקואליציה.</p><p style=\"margin:4px 0\">הקבוצה הבין-גושית מציגה 44% חוסר שביעות רצון – קרוב יותר לעמדת הקואליציה מאשר לאופוזיציה. מסרים של ייאוש מוחלט אינם מדברים אל הקהל המרכזי הזה.\"</p>", "25": "<p style=\"margin:4px 0\">\"שיעור האמון בממשלה ובכנסת נמוך במיוחד: 13% בלבד אצל נשים ו-17% אצל גברים.</p><p style=\"margin:4px 0\">נשים פונות לארגונים חברתיים (56%), בעוד שליש מהגברים מציינים כי אינם סומכים על אף גורם. ההישענות היא על המעגל האישי והקהילתי, ולא על מוסדות המדינה.\"</p>", "27": "<p style=\"margin:4px 0\">\"נעבור לנושאים ולסוגיות שעומדות בראש סדר העדיפויות שלהם.\"</p>", "28": "<p style=\"margin:4px 0\">\"המצב הביטחוני עומד בראש (55%), ואחריו יוקר המחיה (50%). סוגיות הגיוס והתגמול למשרתים מגיעות ל-27%.</p><p style=\"margin:4px 0\">בניגוד למדגם הכללי שבו יוקר המחיה מוביל, אצל הצעירים הביטחון במקום הראשון, ובמיוחד אצל הצעירות (61% מהן שמו את הביטחון בראש). גם אצל הגברים הביטחון ראשון, בפער קטן (50% מול 49%).\"</p>", "29": "<p style=\"margin:4px 0\">\"37.5% מהצעירות מגדירות את מצב הביטחון כ'גרוע', לעומת 14% בלבד מהצעירים.</p><p style=\"margin:4px 0\">הצעירות מביעות דאגה עמוקה ומתמשכת מהמצב הביטחוני, נתון המשפיע באופן ישיר על עמדותיהן הפוליטיות.\"</p>", "30": "<p style=\"margin:4px 0\">\"64% מהצעירים מסכימים עם התפיסה שהמפלגות החרדיות מנצלות את הממשלה מעבר לחלקן באוכלוסייה.</p><p style=\"margin:4px 0\">נתון זה חוצה גושים: 70% מהבין-גושיים ו-42% מהבייס של הקואליציה עצמה מסכימים עם קביעה זו.\"</p>", "31": "<p style=\"margin:4px 0\">\"בפאנלים האיכותניים, כמעט מחצית מהמשתתפים (22 מתוך 45) ציינו נושאים כלכליים – דיור, שכר ושכר לימוד – כדבר שהכי מעצבן אותם במדינה.</p><p style=\"margin:4px 0\">רבים מהם ציינו כי אינם שומעים פוליטיקאים שמציגים פתרונות מעשיים לנושא הדיור והעלויות ביומיום.\"</p>", "32": "<p style=\"margin:4px 0\">\"הביקורת שעלתה בנושא החינוך החרדי ממוקדת בהיבט הכלכלי והאזרחי: 'מאיפה מגיע הכסף ועל חשבון מה'.</p><p style=\"margin:4px 0\">הצעירים מבקשים לראות נתונים שקופים ומספרים ברורים לגבי חלוקת התקציבים.\"</p>", "33": "<p style=\"margin:4px 0\">\"24 מתוך 45 משתתפי הפאנל תומכים בייצוג של הציבור הערבי בכנסת, 19 במגזר הציבורי, ו-13 בלבד בתפקידי שרים בממשלה.</p><p style=\"margin:4px 0\">התמיכה יורדת ככל שמדובר במוקדי קבלת החלטות ושלטון מרכזיים.\"</p>", "35": "<p style=\"margin:4px 0\">\"נעבור לבחירות עצמן: על מי הצעירים סומכים שישמרו על טוהר הבחירות, וממה הם חוששים.\"</p>", "36": "<p style=\"margin:4px 0\">\"בתחתית האמון: המפלגות, ש-59% מהצעירים לא סומכים עליהן שישמרו על טוהר הבחירות, וערוצי החדשות, עם 55% שלא סומכים. בראש הרשימה נמצא שב״כ, עם 52% שסומכים עליו. המשטרה (41%) והרשות השופטת (42%) באמצע: יותר סומכים מאשר לא, אבל בפער קטן.\"</p><p style=\"margin:4px 0;color:var(--ink-2)\">מקור: Hive Surveys, סקר אוגוסט 2026 (2–5.8), 192 צעירים בני 18–25, משוקלל. בשאלה המלאה נשאלו גם על ועדת הבחירות (52% סומכים) והרשויות המקומיות (48%).</p>", "37": "<p style=\"margin:4px 0\">\"בשאלה הפתוחה מי עלול ליזום אלימות אם התוצאות לא יתקבלו, כל גוש מצביע על הצד השני: 47% מצעירי הקואליציה ציינו את השמאל, ועוד 21% את מחאת קפלן ואחים לנשק. אצל צעירי האופוזיציה התשובה המובילה היא החרדים (23%), ואחריהם ימין קיצוני ונתניהו ותומכיו.</p><p style=\"margin:4px 0\">תשובות אלו משקפות תפיסות איום פוליטיות הדדיות הקיימות בציבור.\"</p>", "39": "<p style=\"margin:4px 0\">\"לסיכום, חמש נקודות מרכזיות:</p><p style=\"margin:4px 0\">1. הצעירים רחוקים מהפוליטיקה, ועוד לא החליטו. פוליטיקה אינה חלק מהזהות שלהם, והם פחות בטוחים במי יבחרו מהמדגם הכללי.</p><p style=\"margin:4px 0\">2. הם כועסים על המדינה, לא על החיים. רובם לא מרוצים מהמצב במדינה, אבל מהחיים שלהם הם מרוצים יותר מצעירים במדינות ה-OECD.</p><p style=\"margin:4px 0\">3. הדעה נוצרת בבית, והמידע מגיע מהרשת. המשפחה משפיעה יותר מחברים וממשפיענים, ואינסטגרם היא הערוץ המרכזי למידע פוליטי.</p><p style=\"margin:4px 0\">4. הקהל הבין-גושי: בוגר יותר, מסורתי יותר ופחות תל-אביבי. זו קבוצה קטנה, ושביעות הרצון שלה מהמצב קרובה יותר לקואליציה מאשר לאופוזיציה.</p><p style=\"margin:4px 0\">5. סוגיות בוערות, ואמון נמוך בטוהר הבחירות. ביטחון ויוקר המחיה הם מה שהכי חשוב להם שהממשלה תטפל בו; 64% מרגישים שהמפלגות החרדיות מנצלות את הממשלה, גם 42% מבייס הקואליציה; ורובם לא סומכים על המפלגות (59%) ועל ערוצי החדשות (55%) שישמרו על טוהר הבחירות.</p><p style=\"margin:4px 0\">הם אינם קבוצה מרוסקת, אלא ציבור ענייני שמחפש עובדות, נתונים והתייחסות לבעיות האמיתיות בחיי היומיום. תודה רבה, ואשמח לענות על שאלות.\"</p>", "40": "<p style=\"margin:4px 0\">\"שקפים אלו מרכזים את פירוט המקורות והמתודולוגיה למעקב ולשאלות.\"</p>", "41": "<p style=\"margin:4px 0\">\"שקפים אלו מרכזים את פירוט המקורות והמתודולוגיה למעקב ולשאלות.\"</p>", "9": "<p style=\"margin:4px 0\">בלי להקריא את השקף. משפט אחד: דור שנוטה ימינה, עם מרכז קטן אבל מכריע, וכמעט חציו עומד מול הקלפי בפעם הראשונה.</p><p style=\"margin:4px 0\"><b>מעבר:</b> עכשיו לשאלה שמעניינת את כולם: האם ואיך הם יצביעו.</p>", "15": "<p style=\"margin:4px 0\">המסר אחד: הם לא מנותקים מחוסר ידע, הם פשוט לא מזדהים. לכן הקול שלהם עוד פתוח, והכי פתוח אצל הצעירות.</p><p style=\"margin:4px 0\"><b>מעבר:</b> אם לא הזהות הפוליטית מעצבת את הדעה שלהם, מי כן?</p>", "21": "<p style=\"margin:4px 0\">הבית מעצב, הרשת מעדכנת, ועובדות משכנעות. מי שרוצה להגיע אליהם צריך את שלושתם.</p><p style=\"margin:4px 0\"><b>מעבר:</b> עד כאן הפוליטיקה. עכשיו לשאלה שפתחנו בה: איך הם מרגישים.</p>", "26": "<p style=\"margin:4px 0\">אם יש משפט אחד לזכור מהמצגת, הוא כאן: כועסים על המדינה, לא על החיים. שווה לעצור עליו שנייה לפני שממשיכים.</p><p style=\"margin:4px 0\"><b>מעבר:</b> אז מה מטריד אותם בפועל?</p>", "34": "<p style=\"margin:4px 0\">הביטחון בראש, אבל הכסף הוא מה שמטריד ביומיום, ושם נמצא החור בשיח. והסוגיה החרדית היא זו שחוצה גושים.</p><p style=\"margin:4px 0\"><b>מעבר:</b> ועכשיו לבחירות עצמן: על מי הם סומכים, וממה הם חוששים.</p>", "38": "<p style=\"margin:4px 0\">אמון נמוך בתקשורת ובמפלגות, ותפיסת איום ברורה מהצד השני. שווה לעקוב אחרי שתיהן ככל שהבחירות מתקרבות.</p><p style=\"margin:4px 0\"><b>מעבר:</b> אז מה לקחת מכל זה.</p>"};
