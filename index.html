<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Plants</title>
<meta name="theme-color" content="#2f8f5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Plants">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f8f4;--card:#fff;--text:#1b2a1f;--muted:#6b7a70;--border:#e3e9e3;
  --green:#2f8f5b;--green-d:#1f6b42;--green-soft:#e4f3ea;--late:#d64545;--late-soft:#fbe9e9;--amber:#b7791f;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a15;--card:#1b261f;--text:#e8f0ea;--muted:#93a398;--border:#2a382f;
  --green:#4cc27f;--green-d:#7ddba3;--green-soft:#1f3a2a;--late:#ff7b7b;--late-soft:#3a1f1f;--amber:#e0b050;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
#app{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0}
label>input,label>select,label>textarea{margin-top:4px;font-size:16px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.topbar h1{flex:1;margin:0}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px;margin-bottom:8px}
.row.late{border-inline-start:4px solid var(--late)}
.row .info{flex:1;min-width:0;text-align:start}
.row .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted)}
.sub.late{color:var(--late);font-weight:600}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.ok,.snz{width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
.ok{background:var(--green);color:#fff}
.snz{background:var(--green-soft)}
.primary{display:block;width:100%;background:var(--green);color:#fff;border-radius:12px;padding:13px;font-weight:600;margin-top:16px}
.secondary{background:var(--green-soft);color:var(--green-d);border-radius:10px;padding:9px 14px;font-weight:600}
.danger{color:var(--late)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .big{font-size:48px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;text-align:start;display:block;width:100%}
.pcard .pic{width:100%;aspect-ratio:1;object-fit:cover;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:48px}
.pcard .meta{padding:8px 10px}
.pcard b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:14px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.fab{position:fixed;inset-inline-end:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--green)}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:10px}
.photo-pick{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/10;border-radius:16px;background:var(--green-soft);color:var(--green-d);overflow:hidden;font-size:16px;margin:0}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.task-head{display:flex;align-items:center;gap:8px}
.task-head b{flex:1}
.task-btns{display:flex;gap:8px;margin-top:10px}
.task-btns button{flex:1}
.hist{font-size:14px;padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}
.hist:last-child{border:0}
.hist span:last-child{color:var(--muted);flex:none}
#sheet{position:fixed;inset:0;z-index:20}
#sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:absolute;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.panel h3{margin:0 0 4px;font-size:18px}
.btnrow{display:flex;gap:8px;margin:10px 0}
.btnrow .secondary{flex:1}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));inset-inline:16px;max-width:488px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:30;gap:12px}
#toast[hidden]{display:none}
#toast button{color:#8fe3b0;font-weight:700}
.note{width:100%;min-height:80px}
.room{display:flex;align-items:center;gap:8px;margin-top:8px}.room b{flex:1}.room input{width:76px;padding:8px}
.tiles{display:flex;gap:8px;margin:8px 0 12px}
.tile{flex:1;display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px;text-align:start}
.tile>span{font-size:22px}.tile small{display:block;font-size:12px;opacity:.8}.tile b{font-size:16px}
.ok-t{background:var(--green-soft);color:var(--green-d)}
.late-t{background:var(--late-soft);color:var(--late);flex:none;min-width:110px}
.seg{display:flex;gap:4px;background:var(--green-soft);border-radius:99px;padding:4px;width:fit-content;margin:0 auto 14px}
.seg button{padding:8px 22px;border-radius:99px;color:var(--green-d);font-weight:600}
.seg button.on{background:var(--green);color:#fff}
.card .row{box-shadow:none;background:var(--bg);margin-bottom:6px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-act="tab" data-v="today"><span>📅</span>Today</button>
  <button data-act="tab" data-v="plants"><span>🪴</span>Plants</button>
  <button data-act="tab" data-v="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="importfile" accept="application/json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const shortDate = s => { const [, m, d] = s.split('-'); return `${+d}/${+m}`; };
const days = n => n === 1 ? '1 day' : `${n} days`;

/* ---------- domain ---------- */
const S = (a, b, c, d) => ({ spring: a, summer: b, autumn: c, winter: d });
const SEASONS = { spring: 'Spring', summer: 'Summer', autumn: 'Autumn', winter: 'Winter' };
const seasonOfDate = d => { const m = parse(d).getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 8 ? 'summer' : m >= 9 && m <= 10 ? 'autumn' : 'winter'; };
const season = () => seasonOfDate(today());

// days between waterings, per season (general starting defaults)
const SPECIES = {
  pothos:        { n: 'Pothos',               e: '🌿', water: S(6, 6, 8, 9) },
  monstera:      { n: 'Monstera',           e: '🌱', water: S(8, 8, 12, 17) },
  ficus:         { n: 'Rubber plant / Ficus',              e: '🌳', water: S(7, 7, 10, 12) },
  snake:         { n: 'Snake Plant',      e: '🗡️', water: S(18, 17, 25, 40) },
  spathi:        { n: 'Peace Lily',       e: '🤍', water: S(6, 5, 7, 9) },
  alocasia:      { n: 'Alocasia',           e: '🍃', water: S(7, 7, 10, 14) },
  arrowhead:     { n: 'Arrowhead (Syngonium)',        e: '🌿', water: S(7, 7, 10, 12) },
  calathea:      { n: 'Calathea',             e: '🍂', water: S(6, 5, 8, 12) },
  kentia:        { n: 'Kentia palm',           e: '🌴', water: S(8, 7, 10, 14) },
  hoya:          { n: 'Hoya',                  e: '🪻', water: S(8, 7, 10, 14) },
  dieffenbachia: { n: 'Dieffenbachia',                     e: '🌿', water: S(8, 7, 10, 12) },
  avocado:       { n: 'Avocado',                       e: '🥑', water: S(8, 7, 10, 12) },
  jade:          { n: 'Jade Plant',               e: '🪙', water: S(18, 16, 21, 30) },
  portulacaria:  { n: 'Elephant Bush',   e: '🌳', water: S(16, 16, 21, 30) },
  zz:            { n: 'ZZ Plant',               e: '🌿', water: S(18, 16, 24, 32) },
  euphorbia:     { n: 'Candelabra spurge',        e: '🌵', water: S(21, 18, 28, 35) },
  orchid:        { n: 'Orchid',                         e: '🌸', water: S(7, 6, 8, 10) },
  fern:          { n: 'Fern',                          e: '🍃', water: S(4, 3, 4, 6) },
  succulent:     { n: 'Succulent',                      e: '🪷', water: S(14, 10, 14, 21) },
  cactus:        { n: 'Cactus',                        e: '🌵', water: S(21, 14, 21, 35) },
  herb:          { n: 'Herbs',                   e: '🌿', water: S(3, 2, 3, 5) },
  other:         { n: 'Other',                          e: '🪴', water: S(7, 5, 7, 10) }
};
// rec: 0 = paused this season
const TASKS = {
  water:     { l: 'Watering',     i: '💧', d: 'Watered' },
  fertilize: { l: 'Fertilizing',  i: '🌱', d: 'Fertilized',  rec: S(30, 21, 60, 0) },
  mist:      { l: 'Misting',      i: '🌫️', d: 'Misted',  rec: S(4, 3, 4, 5) },
  prune:     { l: 'Pruning',      i: '✂️', d: 'Pruned',  rec: S(90, 90, 90, 90) },
  repot:     { l: 'Repotting',    i: '🪴', d: 'Repotted', rec: S(365, 365, 365, 365) }
};
const REASONS = ['Soil still moist', 'Was away', 'Other'];
const LOCATIONS = ['Living Room', 'Kitchen', 'Bedroom', 'Balcony', 'Office', 'Bathroom', 'Storage'];

// watering adjustments by pot / light / material / warm spot. Starting values, to be calibrated from the log.
// Watering model: interval = base(species, season) x pot x soil x material x drainage x light x climate, clamped to 0.4-2.5.
// Pot: water capacity grows with volume (~diameter^3) but the plant grows with the pot, so the interval scales ~ diameter^1.5.
const POT = { s: ['Small (about 10 cm)', 10, 'Small'], m: ['Medium (about 15 cm)', 15, 'Medium'], l: ['Large (about 22 cm)', 22, 'Large'] };
const potMult = d => Math.pow(d / 15, 1.5);
const LIGHT = { b: ['Full sun', .8], m: ['Partial sun', 1], d: ['Low light', 1.43] };
const MAT = { p: ['Plastic', 1], g: ['Glazed ceramic', 1], c: ['Concrete', .85], t: ['Terracotta (unglazed clay)', .75, 'Terracotta'], f: ['Fabric / grow bag', .65, 'Fabric'] };
const SOIL = { s: ['Standard potting mix', 1], r: ['Moisture-retentive (peat / coco)', 1.2, 'Moisture-retentive soil'], f: ['Fast-draining (cactus mix / perlite / pumice)', .75, 'Fast-draining soil'] };
const NODRAIN = 1.3;
const nm = (m, k) => m[k][2] || m[k][0];
const optsOf = p => { const o = { pot: 'm', light: 'm', mat: 'p', soil: 's', drain: true, ...(p.opts || {}) }; return { pot: o.pot, light: o.light, mat: o.mat, soil: o.soil, drain: o.drain }; };
// Climate: transpiration follows vapour pressure deficit (VPD). Only the deviation from the typical room of the season counts.
const svp = t => 0.6108 * Math.exp(17.27 * t / (t + 237.3));
const vpd = (t, rh) => svp(t) * (1 - rh / 100);
const SEASON_T = { spring: 23, summer: 26, autumn: 23, winter: 20 };
function climate(p) {
  const r = (DB.rooms || {})[p.location] || {}, t = r.t ?? SEASON_T[season()], rh = r.rh ?? 50;
  return { t, rh, mult: Math.min(2, Math.max(.5, vpd(SEASON_T[season()], 50) / vpd(t, Math.min(rh, 90)))) };
}
// every factor that changes the watering interval, as [label, multiplier]
function factors(p) {
  const o = optsOf(p), c = climate(p);
  return [[`${nm(POT, o.pot)} pot`, potMult(POT[o.pot][1])], [LIGHT[o.light][0], LIGHT[o.light][1]], [`${nm(MAT, o.mat)} pot`, MAT[o.mat][1]],
    [nm(SOIL, o.soil), SOIL[o.soil][1]], ['No drainage holes', o.drain ? 1 : NODRAIN], [`${p.location || 'Room'} ${c.t}°C / ${c.rh}%`, c.mult]]
    .map(f => [f[0], +f[1].toFixed(2)]).filter(f => f[1] !== 1);
}
const waterMult = p => Math.min(2.5, Math.max(.4, factors(p).reduce((m, f) => m * f[1], 1)));
const baseRec = (p, k) => k === 'water' ? (SPECIES[p.species] || SPECIES.other).water[season()] : TASKS[k].rec[season()];
const recInterval = (p, k) => { const b = baseRec(p, k); return k === 'water' ? Math.max(1, Math.round(b * waterMult(p))) : b; };

// effective interval: manual if set, otherwise the seasonal recommendation. Snoozing only moves the current due date.
// no fertilizing in winter: push to the start of spring, and never earlier than spring after a skipped winter
function fertAdjust(last, b) {
  if (seasonOfDate(b) === 'winter') { const x = parse(b); return `${x.getMonth() === 11 ? x.getFullYear() + 1 : x.getFullYear()}-03-01`; }
  const ms = `${parse(today()).getFullYear()}-03-01`;
  return last < ms && ms <= today() && b < ms ? ms : b;
}
function info(p, k) {
  const t = p.tasks[k], rec = recInterval(p, k), interval = t.manual || rec;
  if (!interval) return { interval: 0, rec, base: null, due: null, manual: !!t.manual };
  let base = addDays(t.last, interval);
  if (k === 'fertilize') base = fertAdjust(t.last, base);
  const due = t.snoozeUntil && t.snoozeUntil > base ? t.snoozeUntil : base;
  return { interval, rec, base, due, manual: !!t.manual };
}
function when(due) {
  const d = diff(today(), due);
  if (d < 0) return { txt: `Overdue by ${days(-d)}`, late: true, d };
  if (d === 0) return { txt: 'Today', late: false, d };
  if (d === 1) return { txt: 'Tomorrow', late: false, d };
  return { txt: `In ${days(d)}`, late: false, d };
}

/* ---------- storage ---------- */
const VERSION = '2026-10-27.f';
const KEY = 'plants_v1';
let DB = { v: 1, plants: [], log: [] };
try { const raw = localStorage.getItem(KEY); if (raw) DB = JSON.parse(raw); } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { alert('Could not save. Storage may be full; try exporting a backup and using smaller photos.'); }
}
function addLog(o) { DB.log.push({ t: new Date().toISOString(), season: season(), ...o }); }
const plant = id => DB.plants.find(p => p.id === id);
try { navigator.storage?.persist?.(); } catch (e) {}
DB.rooms = DB.rooms || {};
{ // migrate Hebrew names from the earlier Hebrew build
  const LOC = { 'סלון': 'Living Room', 'מטבח': 'Kitchen', 'חדר שינה': 'Bedroom', 'מרפסת': 'Balcony', 'חדר עבודה': 'Office', 'אמבטיה': 'Bathroom', 'שירותים': 'Bathroom', 'מחסן': 'Storage' };
  DB.plants.forEach(p => { if (LOC[p.location]) p.location = LOC[p.location]; if (p.name === 'דיפנבכיה גדולה') p.name = 'Large Dieffenbachia'; if (p.name === "Amazonian Elephant's Ear 'Polly'") p.name = "Amazonian Elephant's Ear 'Polly' (1)"; });
}

/* ---------- state / render ---------- */
let view = { name: 'today' };
let todayTab = 'today', sheetCtx = null, formPhoto = null, lastUndo = null, toastTimer = null, locFilter = '';

function go(v) { view = v; render(); scrollTo(0, 0); }
function render() {
  const top = ['today', 'plants', 'settings'].includes(view.name);
  $('#nav').hidden = !top;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view.name));
  const fn = { today: vToday, plants: vPlants, settings: vSettings, plant: vPlant, form: vForm }[view.name];
  $('#app').innerHTML = fn();
}
const thumb = (p, cls = 'thumb') => p.photo ? `<img class="${cls}" src="${p.photo}" alt="">` : `<span class="${cls}">${(SPECIES[p.species] || SPECIES.other).e}</span>`;

function vToday() {
  const items = [];
  DB.plants.forEach(p => Object.keys(p.tasks).forEach(k => { const i = info(p, k); if (i.due) items.push({ p, k, i, w: when(i.due) }); }));
  items.sort((a, b) => a.i.due.localeCompare(b.i.due));
  const late = items.filter(x => x.w.d < 0), now = items.filter(x => x.w.d === 0), soon = items.filter(x => x.w.d > 0 && x.w.d <= 30);
  const row = (x, snz = true) => `<div class="row ${x.w.late ? 'late' : ''}">
    <button class="info-btn" data-act="open" data-p="${x.p.id}" style="display:contents">${thumb(x.p)}
      <div class="info"><b><bdi>${esc(x.p.name)}</bdi></b><span class="sub ${x.w.late ? 'late' : ''}">${TASKS[x.k].i} ${TASKS[x.k].l} · ${x.w.txt}</span></div></button>
    ${snz ? `<button class="snz" data-act="snooze" data-p="${x.p.id}" data-k="${x.k}" aria-label="Snooze">⏰</button>` : ''}
    <button class="ok" data-act="done" data-p="${x.p.id}" data-k="${x.k}" aria-label="Done">✓</button></div>`;
  let h = `<h1>Today</h1><div class="sub" style="margin:-10px 0 8px">${SEASONS[season()]} · ${shortDate(today())}</div>`;
  if (!DB.plants.length) return h + `<div class="empty"><div class="big">🪴</div><p>No plants yet.<br>Add your first one?</p><button class="secondary" data-act="new">Add plant</button><br><br><button class="secondary" data-act="seed">Add my plants (${MINE.length})</button></div>`;
  const byTask = {}; now.forEach(x => byTask[x.k] = (byTask[x.k] || 0) + 1);
  const todayTxt = now.length ? Object.entries(byTask).map(([k, n]) => `${TASKS[k].l} ×${n}`).join(', ') : 'None';
  h += `<div class="tiles"><div class="tile ok-t"><span>✔</span><div><small>Today's tasks</small><b>${todayTxt}</b></div></div>
    <button class="tile late-t" data-act="tab2" data-v="today"><span>⏰</span><div><b>${late.length}</b><small>Overdue</small></div></button></div>`;
  h += `<div class="seg"><button class="${todayTab === 'today' ? 'on' : ''}" data-act="tab2" data-v="today">Today</button><button class="${todayTab === 'upcoming' ? 'on' : ''}" data-act="tab2" data-v="upcoming">Upcoming</button></div>`;
  if (todayTab === 'today') {
    const due = [...late, ...now];
    h += due.length ? due.map(x => row(x)).join('') : `<div class="empty"><div class="big">🎉</div><p>All done for today</p></div>`;
  } else if (!soon.length) h += `<div class="empty"><div class="big">🌤️</div><p>No tasks in the next 30 days</p></div>`;
  else {
    const groups = {}; soon.forEach(x => (groups[x.i.due] = groups[x.i.due] || []).push(x));
    h += Object.keys(groups).sort().map(d => { const g = groups[d], w = when(d);
      return `<div class="card"><div class="task-head"><b style="font-size:17px">${w.txt}</b><span class="sub">${shortDate(d)}</span><span class="chip">${g.length === 1 ? '1 task' : g.length + ' tasks'}</span></div><div style="margin-top:8px">${g.map(x => row(x, false)).join('')}</div></div>`; }).join('');
  }
  return h;
}

function vPlants() {
  const locs = [...new Set(DB.plants.map(p => p.location).filter(Boolean))];
  if (locFilter && !locs.includes(locFilter)) locFilter = '';
  const list = DB.plants.filter(p => !locFilter || p.location === locFilter);
  let h = `<h1>Plants</h1>`;
  if (locs.length > 1) h += `<div class="chips"><button class="chip ${locFilter ? '' : 'on'}" data-act="loc" data-v="">All</button>${locs.map(l => `<button class="chip ${locFilter === l ? 'on' : ''}" data-act="loc" data-v="${esc(l)}">${esc(l)}</button>`).join('')}</div>`;
  if (!list.length) h += `<div class="empty"><div class="big">🪴</div><p>No plants yet</p></div>`;
  h += `<div class="grid">` + list.map(p => {
    const dues = Object.keys(p.tasks).map(k => info(p, k).due).filter(Boolean).sort();
    const w = dues[0] ? when(dues[0]) : null;
    return `<button class="pcard" data-act="open" data-p="${p.id}">${thumb(p, 'pic')}<div class="meta"><b><bdi>${esc(p.name)}</bdi></b><span class="sub ${w?.late ? 'late' : ''}">${esc(p.location || SPECIES[p.species].n)}${w ? ' · ' + w.txt : ''}</span></div></button>`;
  }).join('') + `</div><button class="fab" data-act="new" aria-label="Add plant">+</button>`;
  return h;
}

function histText(e) {
  const t = TASKS[e.task] || {};
  if (e.type === 'done') return `${t.i || ''} ${t.d || 'Done'}${e.daysLate > 0 ? ` (${days(e.daysLate)} late)` : e.daysLate < 0 ? ` (${days(-e.daysLate)} early)` : ''}`;
  if (e.type === 'snooze') return `⏰ ${t.l || ''} snoozed ${days(e.days)}${e.reason ? ` · ${e.reason}` : ''}`;
  if (e.type === 'interval') return `🔁 ${t.l || ''}: ${e.from || '-'} → ${e.to ?? 'recommended'} days`;
  if (e.type === 'task_add') return `➕ Added ${t.l}`;
  if (e.type === 'task_remove') return `➖ Removed ${t.l}`;
  return '';
}

/* ---------- sheets / toast ---------- */
function openSheet(html) { const s = $('#sheet'); s.innerHTML = `<div class="backdrop" data-act="closesheet"></div><div class="panel">${html}</div>`; s.hidden = false; }
function closeSheet() { const s = $('#sheet'); s.hidden = true; s.innerHTML = ''; sheetCtx = null; }
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Undo</button>' : ''}`; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; lastUndo = null; }, 6000);
}

/* ---------- actions ---------- */
function doDone(pid, k) {
  const p = plant(pid), t = p.tasks[k], i = info(p, k);
  lastUndo = { pid, k, prev: { ...t }, logLen: DB.log.length };
  addLog({ type: 'done', pid, plant: p.name, species: p.species, task: k, date: today(), planned: i.base, due: i.due,
    daysLate: i.base ? diff(i.base, today()) : null, interval: i.interval, manual: i.manual, snoozes: t.snoozes || 0 });
  t.last = today(); t.snoozeUntil = null; t.snoozes = 0;
  save(); render(); toast(`${p.name}: ${TASKS[k].d}`, true);
}
function doSnooze(n) {
  const { pid, k, reason } = sheetCtx, p = plant(pid), t = p.tasks[k], i = info(p, k);
  lastUndo = { pid, k, prev: { ...t }, logLen: DB.log.length };
  t.snoozeUntil = addDays(today(), n); t.snoozes = (t.snoozes || 0) + 1;
  addLog({ type: 'snooze', pid, plant: p.name, species: p.species, task: k, date: today(), planned: i.base, days: n, until: t.snoozeUntil,
    lateSoFar: diff(i.base, t.snoozeUntil), snoozeNo: t.snoozes, interval: i.interval, reason: reason || null });
  save(); closeSheet(); render(); toast(`Snoozed to ${shortDate(t.snoozeUntil)}`, true);
}
function undo() {
  if (!lastUndo) return;
  const p = plant(lastUndo.pid); if (p) p.tasks[lastUndo.k] = lastUndo.prev;
  DB.log.length = lastUndo.logLen; lastUndo = null; save(); $('#toast').hidden = true; render();
}

const readOpts = () => ({ pot: $('#f-pot').value, light: $('#f-light').value, mat: $('#f-mat').value, soil: $('#f-soil').value, drain: $('#f-drain').checked });
const MINE = [
  ['Alocasia zabarina', 'alocasia', 'Kitchen', 5], ["Amazonian Elephant's Ear 'Polly' (1)", 'alocasia', 'Kitchen', 9], ["Amazonian Elephant's Ear 'Polly' (2)", 'alocasia', 'Kitchen', 3],
  ['Arrowhead', 'arrowhead', 'Kitchen', 9], ["Arrowhead 'Pink Allusion'", 'arrowhead', 'Kitchen', 5], ['Golden Pothos', 'pothos', 'Bedroom', 9],
  ["Pothos 'N'joy'", 'pothos', 'Kitchen', 5], ['Satin Pothos', 'pothos', 'Kitchen', 3], ['Jade Plant', 'jade', 'Kitchen', 3],
  ['Monstera', 'monstera', 'Kitchen', 9], ['Monstera adansonii ssp laniata', 'monstera', 'Kitchen', 15],
  ['Avocado', 'avocado', 'Living Room', 5], ['Peace Lily', 'spathi', 'Kitchen', 15], ['Porcelain Flower', 'hoya', 'Living Room', 9],
  ['Rattlesnake Plant', 'calathea', 'Living Room', 15], ['Rubber Plant', 'ficus', 'Living Room', 15], ['Zz Plant', 'zz', 'Balcony', 25],
  ["Candelabra spurge 'Cristata'", 'euphorbia', 'Balcony', 5], ['Elephant Bush bonsai', 'portulacaria', 'Balcony', 5],
  ["Snake Plant 'Laurentii'", 'snake', 'Bedroom', 19], ['Kentia palm', 'kentia', 'Kitchen', 3], ['Large Dieffenbachia', 'dieffenbachia', 'Kitchen', 5]
];
function seedMine() {
  const nowd = today(); let n = 0;
  MINE.forEach(([name, species, location, ago]) => {
    const last = addDays(nowd, -ago), mk = d => ({ last: d, manual: null, snoozeUntil: null, snoozes: 0 });
    const ex = DB.plants.find(p => p.name === name);
    if (ex) { // already added: correct the location and the watering date (unless there is real care history)
      ex.location = location;
      if (ex.tasks.water && !DB.log.some(e => e.type === 'done' && e.pid === ex.id)) ex.tasks.water.last = last;
      return;
    }
    const p = { id: uid(), name, species, location, photo: null, notes: '', created: nowd, opts: {}, tasks: { water: mk(last), fertilize: mk(nowd) } };
    DB.plants.push(p); addLog({ type: 'add', pid: p.id, plant: name, species, date: nowd, seed: true }); n++;
  });
  save(); return n;
}
function resizePhoto(file) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 640, r = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .72));
    };
    img.onerror = () => res(null); img.src = url;
  });
}
async function shareJSON(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, a = d.act;
  if (a === 'tab') go({ name: d.v });
  else if (a === 'tab2') { todayTab = d.v; render(); }
  else if (a === 'open') go({ name: 'plant', id: d.p, from: view.name });
  else if (a === 'back') go(view.name === 'form' && view.id !== 'new' ? { name: 'plant', id: view.id } : { name: view.from || 'plants' });
  else if (a === 'new') { formPhoto = null; go({ name: 'form', id: 'new', from: view.name }); }
  else if (a === 'edit') { formPhoto = plant(d.p).photo || null; go({ name: 'form', id: d.p }); }
  else if (a === 'loc') { locFilter = d.v; render(); }
  else if (a === 'done') doDone(d.p, d.k);
  else if (a === 'snooze') {
    const p = plant(d.p); sheetCtx = { pid: d.p, k: d.k, reason: null };
    openSheet(`<h3>Snooze ${TASKS[d.k].l.toLowerCase()}?</h3><div class="sub"><bdi>${esc(p.name)}</bdi> · Pick a reason (optional), then how long</div>
      <div class="chips">${REASONS.map(r => `<button class="chip" data-act="reason" data-v="${r}">${r}</button>`).join('')}</div>
      <div class="btnrow"><button class="secondary" data-act="snoozego" data-n="1">1 day</button><button class="secondary" data-act="snoozego" data-n="2">2 days</button></div>
      <div class="btnrow"><input type="number" id="custom-n" min="1" max="90" inputmode="numeric" placeholder="Days"><button class="secondary" data-act="snoozego" data-n="custom">Snooze</button></div>`);
  }
  else if (a === 'reason') { sheetCtx.reason = sheetCtx.reason === d.v ? null : d.v; document.querySelectorAll('.panel .chip').forEach(c => c.classList.toggle('on', c.dataset.v === sheetCtx.reason)); }
  else if (a === 'snoozego') { const n = d.n === 'custom' ? parseInt($('#custom-n').value, 10) : +d.n; if (n >= 1 && n <= 90) doSnooze(n); }
  else if (a === 'closesheet') closeSheet();
  else if (a === 'undo') undo();
  else if (a === 'freq') {
    const p = plant(d.p), i = info(p, d.k); sheetCtx = { pid: d.p, k: d.k };
    openSheet(`<h3>${TASKS[d.k].l} frequency</h3><div class="sub"><bdi>${esc(p.name)}</bdi> · Recommended for ${SEASONS[season()].toLowerCase()}: ${i.rec ? 'every ' + days(i.rec) : 'paused'}</div>
      <label>Every how many days<input type="number" id="freq-n" min="1" max="730" inputmode="numeric" value="${i.interval || ''}"></label>
      <label>Last done<input type="date" id="last-d" value="${p.tasks[d.k].last}" max="${today()}"></label>
      <button class="primary" style="margin-top:6px" data-act="freqsave">Save</button>
      ${i.manual ? `<button class="secondary" style="width:100%;margin-top:8px" data-act="freqreset">Back to recommended</button>` : ''}
      ${d.k !== 'water' ? `<button class="secondary danger" style="width:100%;margin-top:8px" data-act="rmtask">Remove task</button>` : ''}`);
  }
  else if (a === 'freqsave' || a === 'freqreset') {
    const { pid, k } = sheetCtx, p = plant(pid), t = p.tasks[k], from = info(p, k).interval;
    const ld = $('#last-d').value; if (ld && ld <= today()) t.last = ld;
    const raw = $('#freq-n').value, n = raw === '' ? null : parseInt(raw, 10);
    let to; // undefined = no change to the frequency
    if (a === 'freqreset') { if (t.manual) to = null; }
    else if (n >= 1 && n !== from) to = n;
    if (to !== undefined) {
      t.manual = to;
      addLog({ type: 'interval', pid, plant: p.name, species: p.species, task: k, date: today(), from, to, rec: recInterval(p, k) });
    }
    save(); closeSheet(); render();
  }
  else if (a === 'rmtask') {
    const { pid, k } = sheetCtx, p = plant(pid);
    delete p.tasks[k]; addLog({ type: 'task_remove', pid, plant: p.name, task: k, date: today() }); save(); closeSheet(); render();
  }
  else if (a === 'addtask') {
    const p = plant(d.p); p.tasks[d.k] = { last: today(), manual: null, snoozeUntil: null, snoozes: 0 };
    addLog({ type: 'task_add', pid: p.id, plant: p.name, task: d.k, date: today() }); save(); render();
  }
  else if (a === 'saveplant') {
    const name = $('#f-name').value.trim(); if (!name) { $('#f-name').focus(); return; }
    const species = $('#f-species').value, location = $('#f-loc').value.trim();
    if (view.id === 'new') {
      const last = $('#f-last').value || today(), nowd = today();
      const p = { id: uid(), name, species, location, photo: formPhoto, notes: '', created: nowd, opts: readOpts(),
        tasks: { water: { last, manual: null, snoozeUntil: null, snoozes: 0 }, fertilize: { last: nowd, manual: null, snoozeUntil: null, snoozes: 0 } } };
      DB.plants.push(p); addLog({ type: 'add', pid: p.id, plant: name, species, date: nowd });
      save(); go({ name: 'plant', id: p.id, from: 'plants' });
    } else {
      const pl = plant(view.id), before = optsOf(pl), after = readOpts();
      Object.assign(pl, { name, species, location, photo: formPhoto, opts: after });
      if (JSON.stringify(before) !== JSON.stringify(after)) addLog({ type: 'opts', pid: pl.id, plant: name, species, date: today(), from: before, to: after });
      save(); go({ name: 'plant', id: view.id, from: 'plants' });
    }
  }
  else if (a === 'delplant') {
    const p = plant(d.p);
    if (confirm(`Delete ${p.name}? This can't be undone.`)) {
      DB.plants = DB.plants.filter(x => x.id !== p.id); addLog({ type: 'delete', pid: p.id, plant: p.name, date: today() }); save(); go({ name: 'plants' });
    }
  }
  else if (a === 'exportlog') {
    shareJSON(`plants-log-${today()}.json`, { exportedAt: new Date().toISOString(), season: season(),
      plants: DB.plants.map(p => ({ id: p.id, name: p.name, species: p.species, location: p.location, created: p.created,
        tasks: Object.fromEntries(Object.entries(p.tasks).map(([k, t]) => [k, { manual: t.manual, recommended: recInterval(p, k) }])) })), log: DB.log });
  }
  else if (a === 'seed') {
    if (confirm(`Add ${MINE.length} plants with their locations? Last-watered dates come from your other app; plants already added get their date corrected (unless you logged care in this app). You can edit any date via the frequency button → Last done.`)) { seedMine(); go({ name: 'plants' }); }
  }
  else if (a === 'reload') {
    (async () => {
      try {
        const rs = (await navigator.serviceWorker?.getRegistrations?.()) || [];
        await Promise.all(rs.map(r => r.unregister()));
        await Promise.all((await caches.keys()).map(k => caches.delete(k)));
      } catch (e) {}
      location.reload();
    })();
  }
  else if (a === 'exportall') shareJSON(`plants-backup-${today()}.json`, DB);
  else if (a === 'importall') $('#importfile').click();
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.classList.contains('room-in')) {
    const r = el.dataset.room, f = el.dataset.f; let v = el.value === '' ? null : parseFloat(el.value);
    if (Number.isNaN(v)) v = null;
    if (v !== null) v = f === 't' ? Math.min(45, Math.max(0, v)) : Math.min(90, Math.max(10, v));
    DB.rooms = DB.rooms || {}; const o = DB.rooms[r] = DB.rooms[r] || {}, from = o[f] ?? null; o[f] = v;
    addLog({ type: 'room', location: r, field: f, from, to: v, date: today() }); save(); render();
  } else if (el.id === 'photo' && el.files[0]) {
    formPhoto = await resizePhoto(el.files[0]);
    $('#photolbl').innerHTML = formPhoto ? `<img src="${formPhoto}" alt="">` : '📷 Add photo';
  } else if (el.id === 'notes') {
    const p = plant(el.dataset.p); if (p) { p.notes = el.value; save(); }
  } else if (el.id === 'importfile' && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      if (!Array.isArray(data.plants) || !Array.isArray(data.log)) throw 0;
      if (confirm('Restore from backup? Current data will be replaced.')) { DB = data; save(); go({ name: 'today' }); }
    } catch (x) { alert('This file does not look like a backup of this app.'); }
    el.value = '';
  }
});

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
