<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הצמחים שלי</title>
<meta name="theme-color" content="#2f8f5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הצמחים שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f8f4;--card:#fff;--text:#1b2a1f;--muted:#6b7a70;--border:#e3e9e3;
  --green:#2f8f5b;--green-d:#1f6b42;--green-soft:#e4f3ea;--late:#d64545;--late-soft:#fbe9e9;--amber:#b7791f;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a15;--card:#1b261f;--text:#e8f0ea;--muted:#93a398;--border:#2a382f;
  --green:#4cc27f;--green-d:#7ddba3;--green-soft:#1f3a2a;--late:#ff7b7b;--late-soft:#3a1f1f;--amber:#e0b050;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
#app{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0}
label>input,label>select,label>textarea{margin-top:4px;font-size:16px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.topbar h1{flex:1;margin:0}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px;margin-bottom:8px}
.row.late{border-inline-start:4px solid var(--late)}
.row .info{flex:1;min-width:0;text-align:start}
.row .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted)}
.sub.late{color:var(--late);font-weight:600}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.ok,.snz{width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
.ok{background:var(--green);color:#fff}
.snz{background:var(--green-soft)}
.primary{display:block;width:100%;background:var(--green);color:#fff;border-radius:12px;padding:13px;font-weight:600;margin-top:16px}
.secondary{background:var(--green-soft);color:var(--green-d);border-radius:10px;padding:9px 14px;font-weight:600}
.danger{color:var(--late)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .big{font-size:48px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;text-align:start;display:block;width:100%}
.pcard .pic{width:100%;aspect-ratio:1;object-fit:cover;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:48px}
.pcard .meta{padding:8px 10px}
.pcard b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:14px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.fab{position:fixed;inset-inline-start:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--green)}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:72px;margin-bottom:10px}
.photo-pick{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/10;border-radius:16px;background:var(--green-soft);color:var(--green-d);overflow:hidden;font-size:16px;margin:0}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.task-head{display:flex;align-items:center;gap:8px}
.task-head b{flex:1}
.task-btns{display:flex;gap:8px;margin-top:10px}
.task-btns button{flex:1}
.hist{font-size:14px;padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}
.hist:last-child{border:0}
.hist span:last-child{color:var(--muted);flex:none}
#sheet{position:fixed;inset:0;z-index:20}
#sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:absolute;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.panel h3{margin:0 0 4px;font-size:18px}
.btnrow{display:flex;gap:8px;margin:10px 0}
.btnrow .secondary{flex:1}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));inset-inline:16px;max-width:488px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:30;gap:12px}
#toast[hidden]{display:none}
#toast button{color:#8fe3b0;font-weight:700}
.note{width:100%;min-height:80px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-act="tab" data-v="today"><span>📅</span>היום</button>
  <button data-act="tab" data-v="plants"><span>🪴</span>הצמחים שלי</button>
  <button data-act="tab" data-v="settings"><span>⚙️</span>הגדרות</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="importfile" accept="application/json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const shortDate = s => { const [, m, d] = s.split('-'); return `${+d}/${+m}`; };
const inDays = n => n === 1 ? 'ביום' : n === 2 ? 'ביומיים' : `ב-${n} ימים`;
const days = n => n === 1 ? 'יום' : n === 2 ? 'יומיים' : `${n} ימים`;

/* ---------- domain ---------- */
const S = (a, b, c, d) => ({ spring: a, summer: b, autumn: c, winter: d });
const SEASONS = { spring: 'אביב', summer: 'קיץ', autumn: 'סתיו', winter: 'חורף' };
const season = () => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 8 ? 'summer' : m >= 9 && m <= 10 ? 'autumn' : 'winter'; };

// ימים בין השקיות, לפי עונה (ברירות מחדל כלליות להתחלה)
const SPECIES = {
  pothos:   { n: 'פוטוס',            e: '🌿', water: S(7, 5, 7, 10) },
  monstera: { n: 'מונסטרה',          e: '🌱', water: S(7, 6, 8, 12) },
  ficus:    { n: 'פיקוס',            e: '🌳', water: S(7, 5, 7, 10) },
  snake:    { n: 'סנסוויריה',        e: '🗡️', water: S(14, 12, 16, 28) },
  spathi:   { n: 'שלום עולם',        e: '🤍', water: S(6, 4, 6, 8) },
  orchid:   { n: 'סחלב',             e: '🌸', water: S(7, 6, 8, 10) },
  fern:     { n: 'שרך',              e: '🍃', water: S(4, 3, 4, 6) },
  succulent:{ n: 'סוקולנט',          e: '🪷', water: S(14, 10, 14, 21) },
  cactus:   { n: 'קקטוס',            e: '🌵', water: S(21, 14, 21, 35) },
  herb:     { n: 'עשבי תיבול',       e: '🌿', water: S(3, 2, 3, 5) },
  other:    { n: 'אחר',              e: '🪴', water: S(7, 5, 7, 10) }
};
// rec: 0 = מושהה בעונה הזאת
const TASKS = {
  water:     { l: 'השקיה',        i: '💧', d: 'הושקה' },
  fertilize: { l: 'דישון',        i: '🌱', d: 'דושן',  rec: S(30, 21, 60, 0) },
  mist:      { l: 'ריסוס',        i: '🌫️', d: 'רוסס',  rec: S(4, 3, 4, 5) },
  prune:     { l: 'גיזום',        i: '✂️', d: 'גוזם',  rec: S(90, 90, 90, 90) },
  repot:     { l: 'החלפת עציץ',   i: '🪴', d: 'הוחלף', rec: S(365, 365, 365, 365) }
};
const REASONS = ['האדמה עדיין לחה', 'לא הייתי בבית', 'אחר'];
const LOCATIONS = ['סלון', 'מטבח', 'חדר שינה', 'מרפסת', 'חדר עבודה', 'שירותים'];

const recInterval = (p, k) => (k === 'water' ? SPECIES[p.species] || SPECIES.other : TASKS[k]).water?.[season()] ?? TASKS[k].rec[season()];

// התדירות בפועל: ידנית אם הוגדרה, אחרת המומלצת לעונה. דחייה משנה רק את המועד הנוכחי.
function info(p, k) {
  const t = p.tasks[k], rec = recInterval(p, k), interval = t.manual || rec;
  if (!interval) return { interval: 0, rec, base: null, due: null, manual: !!t.manual };
  const base = addDays(t.last, interval);
  const due = t.snoozeUntil && t.snoozeUntil > base ? t.snoozeUntil : base;
  return { interval, rec, base, due, manual: !!t.manual };
}
function when(due) {
  const d = diff(today(), due);
  if (d < 0) return { txt: `באיחור של ${days(-d)}`, late: true, d };
  if (d === 0) return { txt: 'היום', late: false, d };
  if (d === 1) return { txt: 'מחר', late: false, d };
  return { txt: `בעוד ${days(d)}`, late: false, d };
}

/* ---------- storage ---------- */
const KEY = 'plants_v1';
let DB = { v: 1, plants: [], log: [] };
try { const raw = localStorage.getItem(KEY); if (raw) DB = JSON.parse(raw); } catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { alert('לא הצלחתי לשמור. אולי נגמר המקום בזיכרון, נסי לייצא גיבוי ולהקטין תמונות.'); }
}
function addLog(o) { DB.log.push({ t: new Date().toISOString(), season: season(), ...o }); }
const plant = id => DB.plants.find(p => p.id === id);
try { navigator.storage?.persist?.(); } catch (e) {}

/* ---------- state / render ---------- */
let view = { name: 'today' };
let sheetCtx = null, formPhoto = null, lastUndo = null, toastTimer = null, locFilter = '';

function go(v) { view = v; render(); scrollTo(0, 0); }
function render() {
  const top = ['today', 'plants', 'settings'].includes(view.name);
  $('#nav').hidden = !top;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view.name));
  const fn = { today: vToday, plants: vPlants, settings: vSettings, plant: vPlant, form: vForm }[view.name];
  $('#app').innerHTML = fn();
}
const thumb = (p, cls = 'thumb') => p.photo ? `<img class="${cls}" src="${p.photo}" alt="">` : `<span class="${cls}">${(SPECIES[p.species] || SPECIES.other).e}</span>`;

function vToday() {
  const items = [];
  DB.plants.forEach(p => Object.keys(p.tasks).forEach(k => { const i = info(p, k); if (i.due) items.push({ p, k, i, w: when(i.due) }); }));
  items.sort((a, b) => a.i.due.localeCompare(b.i.due));
  const due = items.filter(x => x.w.d <= 0), soon = items.filter(x => x.w.d > 0 && x.w.d <= 7);
  const row = x => `<div class="row ${x.w.late ? 'late' : ''}">
    <button class="info-btn" data-act="open" data-p="${x.p.id}" style="display:contents">${thumb(x.p)}
      <div class="info"><b>${esc(x.p.name)}</b><span class="sub ${x.w.late ? 'late' : ''}">${TASKS[x.k].i} ${TASKS[x.k].l} · ${x.w.txt}</span></div></button>
    <button class="snz" data-act="snooze" data-p="${x.p.id}" data-k="${x.k}" aria-label="דחייה">⏰</button>
    <button class="ok" data-act="done" data-p="${x.p.id}" data-k="${x.k}" aria-label="בוצע">✓</button></div>`;
  let h = `<h1>היום</h1><div class="sub" style="margin:-10px 0 8px">${SEASONS[season()]} · ${shortDate(today())}</div>`;
  if (!DB.plants.length) return h + `<div class="empty"><div class="big">🪴</div><p>עוד אין צמחים.<br>נתחיל מהראשון?</p><button class="secondary" data-act="new">הוספת צמח</button></div>`;
  if (!due.length) h += `<div class="empty"><div class="big">🎉</div><p>הכול מטופל להיום</p></div>`;
  else h += due.map(row).join('');
  if (soon.length) h += `<h2>בימים הקרובים</h2>` + soon.map(x => `<div class="row"><button style="display:contents" data-act="open" data-p="${x.p.id}">${thumb(x.p)}<div class="info"><b>${esc(x.p.name)}</b><span class="sub">${TASKS[x.k].i} ${TASKS[x.k].l} · ${x.w.txt}</span></div></button></div>`).join('');
  return h;
}

function vPlants() {
  const locs = [...new Set(DB.plants.map(p => p.location).filter(Boolean))];
  if (locFilter && !locs.includes(locFilter)) locFilter = '';
  const list = DB.plants.filter(p => !locFilter || p.location === locFilter);
  let h = `<h1>הצמחים שלי</h1>`;
  if (locs.length > 1) h += `<div class="chips"><button class="chip ${locFilter ? '' : 'on'}" data-act="loc" data-v="">הכול</button>${locs.map(l => `<button class="chip ${locFilter === l ? 'on' : ''}" data-act="loc" data-v="${esc(l)}">${esc(l)}</button>`).join('')}</div>`;
  if (!list.length) h += `<div class="empty"><div class="big">🪴</div><p>עוד אין צמחים</p></div>`;
  h += `<div class="grid">` + list.map(p => {
    const dues = Object.keys(p.tasks).map(k => info(p, k).due).filter(Boolean).sort();
    const w = dues[0] ? when(dues[0]) : null;
    return `<button class="pcard" data-act="open" data-p="${p.id}">${thumb(p, 'pic')}<div class="meta"><b>${esc(p.name)}</b><span class="sub ${w?.late ? 'late' : ''}">${esc(p.location || SPECIES[p.species].n)}${w ? ' · ' + w.txt : ''}</span></div></button>`;
  }).join('') + `</div><button class="fab" data-act="new" aria-label="הוספת צמח">+</button>`;
  return h;
}

function histText(e) {
  const t = TASKS[e.task] || {};
  if (e.type === 'done') return `${t.i || ''} ${t.d || 'בוצע'}${e.daysLate > 0 ? ` (באיחור של ${days(e.daysLate)})` : e.daysLate < 0 ? ` (מוקדם ${inDays(-e.daysLate)})` : ''}`;
  if (e.type === 'snooze') return `⏰ ${t.l || ''} נדחה ${inDays(e.days)}${e.reason ? ` · ${e.reason}` : ''}`;
  if (e.type === 'interval') return `🔁 ${t.l || ''}: תדירות ${e.from || '-'} ← ${e.to ?? 'מומלצת'}`;
  if (e.type === 'task_add') return `➕ נוסף ${t.l}`;
  if (e.type === 'task_remove') return `➖ הוסר ${t.l}`;
  return '';
}

function vPlant() {
  const p = plant(view.id); if (!p) return vToday();
  const sp = SPECIES[p.species] || SPECIES.other;
  let h = `<div class="topbar"><button class="icon-btn" data-act="back" aria-label="חזרה">→</button><h1>${esc(p.name)}</h1><button class="icon-btn" data-act="edit" data-p="${p.id}" aria-label="עריכה">✏️</button></div>`;
  h += p.photo ? `<img class="hero" src="${p.photo}" alt="">` : `<div class="hero">${sp.e}</div>`;
  h += `<div class="sub">${esc(sp.n)}${p.location ? ' · ' + esc(p.location) : ''}</div>`;
  Object.keys(p.tasks).forEach(k => {
    const i = info(p, k), T = TASKS[k], w = i.due ? when(i.due) : null;
    h += `<div class="card" style="margin-top:12px"><div class="task-head"><span style="font-size:22px">${T.i}</span><b>${T.l}</b>
      <button class="secondary" data-act="freq" data-p="${p.id}" data-k="${k}">${i.interval ? 'כל ' + days(i.interval) : 'מושהה'} ✎</button></div>
      <div class="sub" style="margin-top:6px">${i.interval ? (i.manual ? 'תדירות ידנית' : `מומלץ ל${SEASONS[season()]}`) : `אין המלצה ל${SEASONS[season()]}`}
        · טיפול אחרון ${shortDate(p.tasks[k].last)}</div>
      ${w ? `<div class="sub ${w.late ? 'late' : ''}" style="margin-top:2px">הבא: ${w.txt} (${shortDate(i.due)})</div>` : ''}
      <div class="task-btns"><button class="secondary" data-act="snooze" data-p="${p.id}" data-k="${k}">⏰ דחייה</button><button class="primary" style="margin:0;padding:9px" data-act="done" data-p="${p.id}" data-k="${k}">✓ ${T.d}</button></div></div>`;
  });
  const missing = Object.keys(TASKS).filter(k => !p.tasks[k]);
  if (missing.length) h += `<h2>הוספת טיפול</h2><div class="chips">${missing.map(k => `<button class="chip" data-act="addtask" data-p="${p.id}" data-k="${k}">${TASKS[k].i} ${TASKS[k].l}</button>`).join('')}</div>`;
  h += `<h2>הערות</h2><textarea class="note" id="notes" data-p="${p.id}" placeholder="למשל: אוהב אור חזק, עלים צהובים...">${esc(p.notes || '')}</textarea>`;
  const hist = DB.log.filter(e => e.pid === p.id && histText(e)).slice(-15).reverse();
  h += `<h2>היסטוריה</h2><div class="card">${hist.length ? hist.map(e => `<div class="hist"><span>${histText(e)}</span><span>${shortDate(e.date || e.t.slice(0, 10))}</span></div>`).join('') : '<div class="sub">עוד אין היסטוריה</div>'}</div>`;
  return h;
}

function vForm() {
  const p = view.id === 'new' ? null : plant(view.id);
  const sel = p?.species || 'pothos';
  const locs = [...new Set([...LOCATIONS, ...DB.plants.map(x => x.location).filter(Boolean)])];
  return `<div class="topbar"><button class="icon-btn" data-act="back" aria-label="חזרה">→</button><h1>${p ? 'עריכת צמח' : 'צמח חדש'}</h1></div>
  <label class="photo-pick" for="photo" id="photolbl">${formPhoto ? `<img src="${formPhoto}" alt="">` : '📷 הוספת תמונה'}</label>
  <input type="file" id="photo" accept="image/*" hidden>
  <label>שם<input id="f-name" value="${esc(p?.name || '')}" placeholder="למשל: הפוטוס של הסלון"></label>
  <label>סוג צמח<select id="f-species">${Object.entries(SPECIES).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v.e} ${v.n}</option>`).join('')}</select></label>
  <label>מיקום<input id="f-loc" list="locs" value="${esc(p?.location || '')}" placeholder="סלון, מטבח..."><datalist id="locs">${locs.map(l => `<option value="${esc(l)}">`).join('')}</datalist></label>
  ${p ? '' : `<label>מתי הושקה לאחרונה<input type="date" id="f-last" value="${today()}" max="${today()}"></label>`}
  <button class="primary" data-act="saveplant">שמירה</button>
  ${p ? `<button class="primary danger" style="background:none;border:1px solid var(--late)" data-act="delplant" data-p="${p.id}">מחיקת הצמח</button>` : ''}`;
}

function vSettings() {
  return `<h1>הגדרות</h1>
  <div class="card"><b>מעקב התנהגות</b><p class="sub">האפליקציה שומרת יומן של כל טיפול ודחייה (${DB.log.length} אירועים). אחרי כמה שבועות אפשר לייצא ולשלוח לניתוח ולהצעות לשיפור המנגנון.</p>
    <button class="secondary" data-act="exportlog" style="width:100%">ייצוא יומן</button></div>
  <div class="card"><b>גיבוי</b><p class="sub">כל הנתונים נשמרים בטלפון בלבד. כדאי לגבות מדי פעם.</p>
    <div class="btnrow"><button class="secondary" data-act="exportall">ייצוא גיבוי</button><button class="secondary" data-act="importall">שחזור מגיבוי</button></div></div>
  <div class="card"><b>עונה נוכחית: ${SEASONS[season()]}</b><p class="sub">תדירויות ההשקיה המומלצות מתחלפות אוטומטית לפי העונה. אפשר תמיד לקבוע תדירות ידנית לצמח.</p></div>
  <div class="card"><b>התקנה בטלפון</b><p class="sub">באייפון: שיתוף ← "הוסף למסך הבית". באנדרואיד: תפריט הדפדפן ← "התקן אפליקציה".</p></div>`;
}

/* ---------- sheets / toast ---------- */
function openSheet(html) { const s = $('#sheet'); s.innerHTML = `<div class="backdrop" data-act="closesheet"></div><div class="panel">${html}</div>`; s.hidden = false; }
function closeSheet() { const s = $('#sheet'); s.hidden = true; s.innerHTML = ''; sheetCtx = null; }
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">ביטול</button>' : ''}`; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; lastUndo = null; }, 6000);
}

/* ---------- actions ---------- */
function doDone(pid, k) {
  const p = plant(pid), t = p.tasks[k], i = info(p, k);
  lastUndo = { pid, k, prev: { ...t }, logLen: DB.log.length };
  addLog({ type: 'done', pid, plant: p.name, species: p.species, task: k, date: today(), planned: i.base, due: i.due,
    daysLate: i.base ? diff(i.base, today()) : null, interval: i.interval, manual: i.manual, snoozes: t.snoozes || 0 });
  t.last = today(); t.snoozeUntil = null; t.snoozes = 0;
  save(); render(); toast(`${p.name}: ${TASKS[k].d}`, true);
}
function doSnooze(n) {
  const { pid, k, reason } = sheetCtx, p = plant(pid), t = p.tasks[k], i = info(p, k);
  lastUndo = { pid, k, prev: { ...t }, logLen: DB.log.length };
  t.snoozeUntil = addDays(today(), n); t.snoozes = (t.snoozes || 0) + 1;
  addLog({ type: 'snooze', pid, plant: p.name, species: p.species, task: k, date: today(), planned: i.base, days: n, until: t.snoozeUntil,
    lateSoFar: diff(i.base, t.snoozeUntil), snoozeNo: t.snoozes, interval: i.interval, reason: reason || null });
  save(); closeSheet(); render(); toast(`נדחה ל-${shortDate(t.snoozeUntil)}`, true);
}
function undo() {
  if (!lastUndo) return;
  const p = plant(lastUndo.pid); if (p) p.tasks[lastUndo.k] = lastUndo.prev;
  DB.log.length = lastUndo.logLen; lastUndo = null; save(); $('#toast').hidden = true; render();
}

function resizePhoto(file) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 640, r = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .72));
    };
    img.onerror = () => res(null); img.src = url;
  });
}
async function shareJSON(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset, a = d.act;
  if (a === 'tab') go({ name: d.v });
  else if (a === 'open') go({ name: 'plant', id: d.p, from: view.name });
  else if (a === 'back') go(view.name === 'form' && view.id !== 'new' ? { name: 'plant', id: view.id } : { name: view.from || 'plants' });
  else if (a === 'new') { formPhoto = null; go({ name: 'form', id: 'new', from: view.name }); }
  else if (a === 'edit') { formPhoto = plant(d.p).photo || null; go({ name: 'form', id: d.p }); }
  else if (a === 'loc') { locFilter = d.v; render(); }
  else if (a === 'done') doDone(d.p, d.k);
  else if (a === 'snooze') {
    const p = plant(d.p); sheetCtx = { pid: d.p, k: d.k, reason: null };
    openSheet(`<h3>לדחות את ${TASKS[d.k].l}?</h3><div class="sub">${esc(p.name)} · אפשר לבחור סיבה (לא חובה), ואז לכמה זמן</div>
      <div class="chips">${REASONS.map(r => `<button class="chip" data-act="reason" data-v="${r}">${r}</button>`).join('')}</div>
      <div class="btnrow"><button class="secondary" data-act="snoozego" data-n="1">יום</button><button class="secondary" data-act="snoozego" data-n="2">יומיים</button></div>
      <div class="btnrow"><input type="number" id="custom-n" min="1" max="90" inputmode="numeric" placeholder="מספר ימים"><button class="secondary" data-act="snoozego" data-n="custom">דחייה</button></div>`);
  }
  else if (a === 'reason') { sheetCtx.reason = sheetCtx.reason === d.v ? null : d.v; document.querySelectorAll('.panel .chip').forEach(c => c.classList.toggle('on', c.dataset.v === sheetCtx.reason)); }
  else if (a === 'snoozego') { const n = d.n === 'custom' ? parseInt($('#custom-n').value, 10) : +d.n; if (n >= 1 && n <= 90) doSnooze(n); }
  else if (a === 'closesheet') closeSheet();
  else if (a === 'undo') undo();
  else if (a === 'freq') {
    const p = plant(d.p), i = info(p, d.k); sheetCtx = { pid: d.p, k: d.k };
    openSheet(`<h3>תדירות ${TASKS[d.k].l}</h3><div class="sub">${esc(p.name)} · המלצה ל${SEASONS[season()]}: ${i.rec ? 'כל ' + days(i.rec) : 'מושהה'}</div>
      <label>כל כמה ימים<input type="number" id="freq-n" min="1" max="730" inputmode="numeric" value="${i.interval || ''}"></label>
      <button class="primary" style="margin-top:6px" data-act="freqsave">שמירה</button>
      ${i.manual ? `<button class="secondary" style="width:100%;margin-top:8px" data-act="freqreset">חזרה להמלצה</button>` : ''}
      ${d.k !== 'water' ? `<button class="secondary danger" style="width:100%;margin-top:8px" data-act="rmtask">הסרת הטיפול</button>` : ''}`);
  }
  else if (a === 'freqsave' || a === 'freqreset') {
    const { pid, k } = sheetCtx, p = plant(pid), t = p.tasks[k], from = info(p, k).interval;
    const n = a === 'freqreset' ? null : parseInt($('#freq-n').value, 10);
    if (a === 'freqsave' && !(n >= 1)) return;
    t.manual = n; addLog({ type: 'interval', pid, plant: p.name, species: p.species, task: k, date: today(), from, to: n, rec: recInterval(p, k) });
    save(); closeSheet(); render();
  }
  else if (a === 'rmtask') {
    const { pid, k } = sheetCtx, p = plant(pid);
    delete p.tasks[k]; addLog({ type: 'task_remove', pid, plant: p.name, task: k, date: today() }); save(); closeSheet(); render();
  }
  else if (a === 'addtask') {
    const p = plant(d.p); p.tasks[d.k] = { last: today(), manual: null, snoozeUntil: null, snoozes: 0 };
    addLog({ type: 'task_add', pid: p.id, plant: p.name, task: d.k, date: today() }); save(); render();
  }
  else if (a === 'saveplant') {
    const name = $('#f-name').value.trim(); if (!name) { $('#f-name').focus(); return; }
    const species = $('#f-species').value, location = $('#f-loc').value.trim();
    if (view.id === 'new') {
      const last = $('#f-last').value || today(), nowd = today();
      const p = { id: uid(), name, species, location, photo: formPhoto, notes: '', created: nowd,
        tasks: { water: { last, manual: null, snoozeUntil: null, snoozes: 0 }, fertilize: { last: nowd, manual: null, snoozeUntil: null, snoozes: 0 } } };
      DB.plants.push(p); addLog({ type: 'add', pid: p.id, plant: name, species, date: nowd });
      save(); go({ name: 'plant', id: p.id, from: 'plants' });
    } else {
      Object.assign(plant(view.id), { name, species, location, photo: formPhoto });
      save(); go({ name: 'plant', id: view.id, from: 'plants' });
    }
  }
  else if (a === 'delplant') {
    const p = plant(d.p);
    if (confirm(`למחוק את ${p.name}? אי אפשר לשחזר.`)) {
      DB.plants = DB.plants.filter(x => x.id !== p.id); addLog({ type: 'delete', pid: p.id, plant: p.name, date: today() }); save(); go({ name: 'plants' });
    }
  }
  else if (a === 'exportlog') {
    shareJSON(`plants-log-${today()}.json`, { exportedAt: new Date().toISOString(), season: season(),
      plants: DB.plants.map(p => ({ id: p.id, name: p.name, species: p.species, location: p.location, created: p.created,
        tasks: Object.fromEntries(Object.entries(p.tasks).map(([k, t]) => [k, { manual: t.manual, recommended: recInterval(p, k) }])) })), log: DB.log });
  }
  else if (a === 'exportall') shareJSON(`plants-backup-${today()}.json`, DB);
  else if (a === 'importall') $('#importfile').click();
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'photo' && el.files[0]) {
    formPhoto = await resizePhoto(el.files[0]);
    $('#photolbl').innerHTML = formPhoto ? `<img src="${formPhoto}" alt="">` : '📷 הוספת תמונה';
  } else if (el.id === 'notes') {
    const p = plant(el.dataset.p); if (p) { p.notes = el.value; save(); }
  } else if (el.id === 'importfile' && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      if (!Array.isArray(data.plants) || !Array.isArray(data.log)) throw 0;
      if (confirm('לשחזר מהגיבוי? הנתונים הנוכחיים יוחלפו.')) { DB = data; save(); go({ name: 'today' }); }
    } catch (x) { alert('הקובץ לא נראה כמו גיבוי של האפליקציה.'); }
    el.value = '';
  }
});

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
